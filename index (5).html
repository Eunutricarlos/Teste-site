<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nome do sistema</title>
<style>
:root{--bg:#f4f4f4;--ink:#1f2a33;--mut:#66727c;--brand:#1b4f72;--brand-d:#143a55;--brand-l:#e1ebf2;--acc:#d75413;--acc-l:#fbe9e0;--card:#fff;--bd:#dcdfe2;--red:#c0392b;--ok:#1e8449;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;color:var(--brand)}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--bd);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:.25rem;font-weight:600}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.acc{background:var(--acc)}
.btn.sec{background:var(--brand-l);color:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--bd)}
.btn.red{background:#fdecea;color:var(--red)}
.btn.sm{padding:.35rem .65rem;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:.85rem}
.tag{display:inline-block;background:var(--acc-l);color:var(--acc);padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:700}
.stat b{display:block;font-size:1.8rem;color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--bd);font-size:.9rem}
th{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.pill{cursor:pointer}
details{border:1px solid var(--bd);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0;background:#fafafa}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
.shell{display:flex;min-height:100vh}
aside{width:240px;background:var(--brand);color:#dbe7ef;padding:1rem .8rem;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;color:#fff;padding:.3rem .5rem 1rem;font-size:1.05rem}
.logo svg{width:28px;height:28px;stroke:#fff}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .7rem;border-radius:10px;color:#dbe7ef;cursor:pointer;margin-bottom:2px}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--acc);color:#fff}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;background:#fff;border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:5}
.burger{display:none;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--brand)}
main{padding:1.2rem;max-width:1100px;margin:0 auto}
.scrim{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--brand-d),var(--brand) 65%,var(--acc) 160%)}
.auth .box{background:#fff;border-radius:20px;padding:1.5rem;width:100%;max-width:460px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:1rem}
.tabs button{flex:1;border:0;background:none;padding:.55rem;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin:.5rem 0}
.bar{height:8px;background:#e6e8ea;border-radius:9px;overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--acc)}
.meal{border:1px solid var(--bd);border-radius:12px;padding:.8rem;margin-bottom:.8rem;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand-d);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ck{display:flex;gap:.5rem;padding:.35rem 0;font-size:.9rem}
.ck b{width:1.2rem;text-align:center}.ck .y{color:var(--ok)}.ck .w{color:var(--acc)}.ck .n{color:var(--mut)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-size:.8rem;cursor:pointer;font-weight:600}
.pwm{font-size:.78rem;margin-top:.2rem}
.printonly{display:none}
@media(max-width:820px){
 aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.2s}
 .shell.open aside{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
 .burger{display:block}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .g4.keep{grid-template-columns:repeat(2,1fr)}
 main{padding:.9rem}
}
@media print{
 aside,.top,.noprint,.scrim,.toast,.screenonly{display:none!important}
 .printonly{display:block!important}
 body{background:#fff}main{padding:0;max-width:none}
 .pr h1{font-size:1.3rem}.pr table th,.pr table td{border:1px solid #999}
}
.modal{position:fixed;inset:0;background:rgba(20,58,85,.6);z-index:40;display:grid;place-items:center;padding:1rem}
.mbox{background:#fff;border-radius:18px;padding:1.4rem;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:5px solid var(--acc)}
.notice{background:var(--brand-l);color:var(--brand-d);border-left:4px solid var(--brand);border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem;font-size:.9rem}
.pt{min-height:100vh;background:var(--bg)}
.pthead{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:2rem 1.2rem 3.2rem;border-bottom:5px solid var(--acc)}
.ptwrap{max-width:720px;margin:-2rem auto 2rem;padding:0 1rem}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.chip{background:#fff;border-radius:14px;padding:.7rem;text-align:center;border:1px solid var(--bd)}
.chip b{display:block;font-size:1.25rem;color:var(--acc)}
.ptmeal{display:flex;gap:.9rem;background:#fff;border-radius:16px;padding:1rem;margin-bottom:.8rem;border:1px solid var(--bd)}
.pttime{min-width:56px;text-align:center;font-weight:700;color:var(--brand);border-right:3px solid var(--acc);padding-right:.7rem}
@media(max-width:820px){.chips{grid-template-columns:repeat(2,1fr)}}
.mbox.full{max-width:640px;height:92vh;display:flex;flex-direction:column}
.pklist{overflow:auto;flex:1;margin-top:.4rem}
.chips2{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0}
.chip2{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:.3rem .85rem;font-size:.86rem;cursor:pointer;flex-shrink:0}
.chip2.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.gauge{display:flex;height:10px;border-radius:99px;position:relative;margin:.5rem 0;background:#eee}
.gauge span{display:block;height:100%}.gauge span:first-child{border-radius:99px 0 0 99px}.gauge span:nth-last-child(2){border-radius:0 99px 99px 0}
.gauge.dim{opacity:.3}.mark{position:absolute;top:-4px;width:5px;height:18px;background:var(--ink);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px #fff;transition:left .35s}
.mchips{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0}.mchip{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;font-weight:600}
.mchip.y{background:#e3f4ea;color:#1e7a45}.mchip.w{background:#fdf3d6;color:#8a6500}.mchip.r{background:#fbe1df;color:#a93226}
.pctin{width:58px;padding:.15rem .3rem;display:inline-block;font-size:.8rem}.mbal{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed var(--bd)}
.daybar{position:sticky;top:58px;z-index:4;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:.6rem .8rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chip3{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:99px;padding:.12rem .6rem;margin:0 .3rem .3rem 0;font-size:.8rem;cursor:pointer}.chip3 b{margin-left:.35rem;color:var(--acc)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-radius:18px;padding:1.2rem;border-bottom:5px solid var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1rem}
.tile{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:1rem .6rem;text-align:center;cursor:pointer;transition:.18s}
.tile:hover,.card.pill:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(27,79,114,.15)}
.tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto .5rem}.tic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem .1rem;border-radius:12px;background:var(--bg);cursor:pointer;text-align:center}
.wd.has{background:var(--acc-l);border:1px solid var(--acc)}.wd b{font-size:1.1rem}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}.wd .small:last-child{font-size:.65rem}}
</style>
</head>

 TMBM.forEach(m=>{const t=m.f(o);const fa=m.fao?FAOF[o.sexo][FAOI[o.af]]:HBF[o.af];out.push({id:m.id,n:m.n,t,g:t==null?null:t*fa+add,fa,need:m.need})});

function calcMeta(silent){

function planCalc(pl){
 const z=()=>({k:0,p:0,c:0,l:0,f:0,n:{1:0,2:0,3:0,4:0}});
 const meals=pl.meals.map(m=>{const t=z();m.items.forEach(it=>{const f=food(it.foodId);if(!f)return;const r=it.g/100;t.k+=f.k*r;t.p+=f.p*r;t.c+=f.c*r;t.l+=f.l*r;t.f+=(f.f||0)*r;t.n[f.nova||1]+=f.k*r});return t});
 const tot=meals.reduce((s,m)=>{for(const k of['k','p','c','l','f'])s[k]+=m[k];for(const n of[1,2,3,4])s.n[n]+=m.n[n];return s},z());
 return{meals,tot};
}
const bar=(label,val,tgt,un)=>{const pc=tgt?val/tgt*100:0;return `<div><div class="row sp small"><b>${label}</b><span>${f0(val)} / ${f0(tgt)} ${un}</span></div><div class="bar"><i class="${pc>105?'over':''}" style="width:${Math.min(100,pc)}%"></i></div></div>`};
function planChecks(pl,c,p){
 const t=c.tot,km=t.c*4+t.p*4+t.l*9,o=p?patInput(p):null,A=o?o.A:30,mo=o?Math.round(o.idade*12):360,cond=o?o.cond:'none',out=[];
 if(!km)return[['n','Adicione alimentos para ver a conferência.']];
 const dev=(t.k-pl.kcal)/pl.kcal*100;out.push([Math.abs(dev)<=10?'y':'w',`Energia: ${f0(t.k)} kcal (${dev>=0?'+':''}${f1(dev)}% da meta; tolerância ±10%)`]);
 const R=amdr(A,mo),pc=t.c*4/km*100,pp=t.p*4/km*100,pl2=t.l*9/km*100;
 if(R){for(const[n,v,r]of[['Carboidrato',pc,R.c],['Proteína',pp,R.p],['Lipídio',pl2,R.l]])out.push([v>=r[0]&&v<=r[1]?'y':'w',`${n}: ${f1(v)}% das kcal (AMDR/DRI: ${r[0]}–${r[1]}%)`])}
 const cr=chorda(A,mo,cond);if(cr)out.push([t.c>=cr?'y':'w',`Carboidrato: ${f0(t.c)} g (RDA: mínimo de ${cr} g/dia)`]);
 if(o&&o.peso){const rda=protRDA(A,mo,cond);out.push([t.p/o.peso>=rda-0.05?'y':'w',`Proteína: ${f1(t.p/o.peso)} g/kg (RDA: ${String(rda).replace('.',',')} g/kg)`])}
 out.push([t.f>=14*t.k/1000?'y':'w',`Fibras: ${f1(t.f)} g (DRI/AI: 14 g por 1.000 kcal = ${f1(14*t.k/1000)} g)`]);
 const nm=pl.meals.filter(m=>m.items.length).length;out.push([nm>=3?'y':'w',`${nm} refeição(ões) com alimentos (Guia Alimentar: pelo menos 3 refeições + lanches)`]);
 const sh=n=>t.k?t.n[n]/t.k*100:0;
 out.push([sh(4)===0?'y':'n',`Ultraprocessados (NOVA 4): ${f1(sh(4))}% das kcal. O Guia Alimentar recomenda evitar.`]);
 out.push(['n',`In natura/minimamente processados (NOVA 1): ${f1(sh(1))}% · Ingredientes culinários (2): ${f1(sh(2))}% · Processados (3): ${f1(sh(3))}%`]);
 return out;
}

 const[fl,data]=await zip(JSON.stringify(obj)),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pin,salt),data)),all=new Uint8Array(29+ct.length);

}

function unitsFor(f){
 const u=[['g',1]],d=f.gr==='Bebidas'?1:LIQ[f.nome];if(d)u.push(['mL',d]);
 (f.med&&f.med.length?f.med:MEDN[f.nome]||[]).forEach(m=>u.push(m));return u;
}
const unitG=(f,u)=>(unitsFor(f).find(x=>x[0]===u)||['g',1])[1];
function pq(s){s=String(s).trim().replace(',','.');let m=s.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]/+m[2];m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]+ +m[2]/+m[3];return parseFloat(s)||0}
function fmtQ(q){const fr={0.25:'¼',0.5:'½',0.75:'¾'},w=Math.floor(q),r=+(q-w).toFixed(2);if(fr[r])return(w?w:'')+fr[r];return String(Math.round(q*100)/100).replace('.',',')}
function qtyLabel(it){const u=it.u||'g',q=it.q??it.g;return u==='g'?`${f1(it.g)} g`:u==='mL'?`${fmtQ(q)} mL`:`${fmtQ(q)} ${u} (${f0(it.g)} g)`}

function lineChart(pts,unit,color){
 if(pts.length<2)return '<p class="small mut">Registre pelo menos 2 medidas para ver a evolução.</p>';
 const W=320,H=140,pl=36,pr=14,pt=16,pb=24,xs=pts.map(p=>new Date(p.d).getTime()),ys=pts.map(p=>p.v);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.18;y0-=pd;y1+=pd;
 const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),dm=d=>{const a=d.split('-');return a[2]+'/'+a[1]};
 const line=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const last=pts[pts.length-1],first=pts[0],dl=last.v-first.v;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Evolução de ${unit}: de ${f1(first.v)} para ${f1(last.v)}">
 <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#dcdfe2"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#dcdfe2"/>
 <text x="${pl-4}" y="${Y(y1-pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y1-pd)}</text><text x="${pl-4}" y="${Y(y0+pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y0+pd)}</text>
 <text x="${pl}" y="${H-8}" font-size="9" fill="#66727c">${dm(pts[0].d)}</text><text x="${W-pr}" y="${H-8}" font-size="9" text-anchor="end" fill="#66727c">${dm(last.d)}</text>
 <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
 <text x="${X(xs[xs.length-1])}" y="${Y(last.v)-8}" font-size="10" font-weight="700" text-anchor="end" fill="${color}">${f1(last.v)} ${unit}</text></svg>
 <div class="small mut">Variação: <b style="color:${color}">${dl>0?'+':''}${f1(dl)} ${unit}</b> desde ${fdate(first.d)}</div>`;
}

/* ===== GRÁFICOS (várias séries, faixas, rosca, barras) ===== */

 if(!all.length||Math.max(...list.map(s=>s.pts.length))<2)return '<p class="small mut">Registre pelo menos 2 medidas para ver a evolução.</p>';

 let y0=Math.min(...all.map(p=>p.v)),y1=Math.max(...all.map(p=>p.v));if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.2;y0-=pd;y1+=pd;
 const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),dm=d=>d.slice(8)+'/'+d.slice(5,7);

  return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>${s.pts.map(p=>`<circle cx="${X(new Date(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.4" fill="#fff" stroke="${s.c}" stroke-width="2"/>`).join('')}<text x="${X(new Date(l.d).getTime())}" y="${Y(l.v)-8}" font-size="10" font-weight="700" text-anchor="end" fill="${s.c}">${f1(l.v)}</text>`}).join('');

 const s0=list[0],dl=s0.pts[s0.pts.length-1].v-s0.pts[0].v;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Gráfico de evolução em ${unit}">${bd}<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#dcdfe2"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#dcdfe2"/>
 <text x="${pl-4}" y="${Y(y1-pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y1-pd)}</text><text x="${pl-4}" y="${Y(y0+pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y0+pd)}</text>
 <text x="${pl}" y="${H-8}" font-size="9" fill="#66727c">${dm(mn)}</text><text x="${W-pr}" y="${H-8}" font-size="9" text-anchor="end" fill="#66727c">${dm(mx)}</text>${lines}</svg>${leg}
 <div class="small mut">${list.length===1?`Variação: <b style="color:${s0.c}">${dl>0?'+':''}${f1(dl)} ${unit}</b> desde ${fdate(s0.pts[0].d)}`:unit}</div>`;
}

  rows.forEach((c,i)=>{if(i===0&&isNaN(num(c[2])))return;if(c.length<6||!c[0])return;

}

  <h3 style="margin-top:1rem">Classificação NOVA</h3><table>${[[1,'Arroz, feijão, frutas, legumes, carnes, ovos, leite, farinhas, massas simples'],[2,'Óleos, gorduras, sal, açúcar, mel, amidos'],[3,'Queijos, pães simples, conservas, frutas em calda'],[4,'Refrigerantes, biscoitos recheados, salgadinhos, embutidos, pães de forma industriais, macarrão instantâneo']].map(r=>`<tr><td><b>${r[0]}</b> ${NOVAN[r[0]]}</td><td class="small">${r[1]}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Classificações antropométricas</h2><div class="grid g2"><div><h3>IMC – adultos (OMS)</h3><table>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
  <div><h3>IMC – idosos ≥ 60 anos (SISVAN/MS)</h3><table><tr><td>≤ 22</td><td>Baixo peso</td></tr><tr><td>&gt; 22 e &lt; 27</td><td>Adequado</td></tr><tr><td>≥ 27</td><td>Sobrepeso</td></tr></table>
  <h3 style="margin-top:1rem">Cintura (OMS)</h3><p class="small">Risco aumentado: homens ≥ 94 cm, mulheres ≥ 80 cm. Muito aumentado: ≥ 102 cm e ≥ 88 cm.</p></div></div>
  <p class="small mut">Crianças e adolescentes: usar escore-z de IMC/idade (curvas da OMS), conforme SISVAN e Caderneta da Criança.</p></div>
 <div class="card"><h2>DRI – faixas de distribuição de macronutrientes (AMDR)</h2><table><tr><th>Faixa etária</th><th>CHO</th><th>PTN</th><th>LIP</th></tr><tr><td>1 a 3 anos</td><td>45–65%</td><td>5–20%</td><td>30–40%</td></tr><tr><td>4 a 18 anos</td><td>45–65%</td><td>10–30%</td><td>25–35%</td></tr><tr><td>Adultos</td><td>45–65%</td><td>10–35%</td><td>20–35%</td></tr></table>
  <p class="small mut">Outras referências: fibras 14 g/1.000 kcal; açúcar livre e gordura saturada &lt; 10% das kcal; gordura trans &lt; 1%; sódio &lt; 2 g/dia (OMS).</p></div>
 <div class="card"><h2>DRI – micronutrientes (RDA/AI)</h2><div class="grid g3">
  <div><label>Sexo</label><select onchange="S.rf.sexo=this.value;rfOut()"><option value="F">Feminino</option><option value="M">Masculino</option></select></div>
  <div><label>Idade (anos)</label><input type="number" value="${S.rf.idade}" oninput="S.rf.idade=num(this.value);rfOut()"></div>
  <div><label>Condição</label><select onchange="S.rf.cond=this.value;rfOut()">${CONDL.filter(c=>c[0]==='none'||c[0][0]==='g'||c[0][0]==='l').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div></div>
  <div id="rfout" style="margin-top:.8rem">${rfHtml()}</div></div>
 <div class="card"><h2>Fontes</h2><ul class="small" style="padding-left:1.2rem;margin:0"><li>Institute of Medicine. Dietary Reference Intakes for Energy, Carbohydrate, Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids (2005) e demais volumes DRI.</li><li>National Academies. Dietary Reference Intakes for Sodium and Potassium (2019).</li><li>Ministério da Saúde. Guia Alimentar para a População Brasileira, 2ª ed. (2014).</li><li>Ministério da Saúde. Orientações para a avaliação do estado nutricional no SISVAN.</li><li>FAO/WHO/UNU. Energy and protein requirements (1985). OMS. Physical status (1995) e Obesity (2000).</li><li>NEPA/Unicamp. Tabela Brasileira de Composição de Alimentos (TACO), 4ª ed. (2011).</li></ul></div>`;
}
function rfHtml(){
 const A=Math.floor(S.rf.idade),rows=driMicro(S.rf.sexo,A,S.rf.cond);
 if(!rows.length)return '<p class="mut small">Para menores de 1 ano, consulte a tabela DRI de lactentes.</p>';
 return `<p class="small mut">Grupo: ${GR[grp(A)]}${S.rf.cond!=='none'&&S.rf.sexo==='F'&&(A<14||A>50)?' · valores de gestação/lactação só existem para 14–50 anos (mostrando os valores gerais)':''}</p><table>${rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="small mut">${r[2]}</td></tr>`).join('')}</table>`;
}
function rfOut(){const e=document.getElementById('rfout');if(e)e.innerHTML=rfHtml()}

/* ===== CONTA ===== */
function vConta(){
 const u=S.user;
 return `<h1>Minha conta</h1>
 <form class="card" onsubmit="saveProfile(event)"><h2>Perfil</h2><div class="grid g2"><div><label>Nome</label><input name="nome" required value="${esc(u.nome)}"></div><div><label>E-mail</label><input value="${esc(u.email)}" disabled></div>
 ${u.perfil==='est'?`<div><label>Instituição</label><input name="inst" value="${esc(u.inst)}"></div><div><label>Período</label><input name="periodo" value="${esc(u.periodo)}"></div><div><label>Orientador(a)</label><input name="orient" value="${esc(u.orient)}"></div>`:''}
 ${u.perfil==='nut'?`<div><label>CRN</label><input name="crn" value="${esc(u.crn)}"></div>`:''}</div><button class="btn" style="margin-top:.8rem">Salvar perfil</button></form>
 <form class="card" onsubmit="changePass(event)"><h2>Trocar senha</h2>${pwField('atual','Senha atual','current-password')}${pwField('nova','Nova senha (mín. 8, com letras e números)','new-password',1)}${pwField('nova2','Confirmar nova senha','new-password')}<div class="err" id="authmsg"></div><button class="btn">Trocar senha</button></form>
 <div class="card"><h2>Backup dos dados</h2><p class="small mut">Os dados ficam só neste navegador. Faça backup com frequência e guarde o arquivo em local seguro (ele contém dados de pacientes).</p>
 <div class="row"><button class="btn sec" onclick="exportData()">Baixar backup</button><label class="btn ghost" style="margin:0">Restaurar backup<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>
 <div class="card"><h2>Sessão</h2><div class="row"><button class="btn ghost" onclick="logout()">Sair</button><button class="btn red" onclick="delAccount()">Excluir minha conta e dados</button></div></div>`;
}
function saveProfile(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 ['nome','inst','periodo','orient','crn'].forEach(k=>{if(f[k])u[k]=f[k].value.trim()});LS.set('nd_users',users);S.user=u;toast('Perfil salvo');render();
}
async function changePass(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 if(u.hash!==await hash(f.atual.value,u.salt))return amsg('Senha atual incorreta.');
 if(!pwOk(f.nova.value))return amsg('A nova senha precisa de 8+ caracteres, com letras e números.');
 if(f.nova.value!==f.nova2.value)return amsg('As senhas não conferem.');
 u.hash=await hash(f.nova.value,u.salt);LS.set('nd_users',users);S.user=u;pushMsg(u.id,'redefinida',u);toast('Senha alterada. Deixamos um aviso na sua caixa de mensagens.');e.target.reset();
}
function exportData(){
 const b=new Blob([JSON.stringify({v:2,data:S.data},null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='backup-'+today()+'.json';a.click();
}
function importData(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data||!Array.isArray(j.data.patients))throw 0;if(!confirm('Isso substitui os dados atuais. Continuar?'))return;S.data=Object.assign(emptyData(),j.data);save();toast('Backup restaurado');render()}catch(e){toast('Arquivo inválido.')}};
 r.readAsText(f);
}
function delAccount(){
 if(!confirm('Excluir sua conta e TODOS os dados? Não dá para desfazer.'))return;
 LS.set('nd_users',LS.get('nd_users',[]).filter(u=>u.id!==S.user.id));localStorage.removeItem('nd_data_'+S.user.id);logout();
}
boot();
</script>
</body>
</html>
