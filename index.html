<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nome do sistema</title>
<style>
:root{--bg:#f4f4f4;--ink:#1f2a33;--mut:#66727c;--brand:#1b4f72;--brand-d:#143a55;--brand-l:#e1ebf2;--acc:#d75413;--acc-l:#fbe9e0;--card:#fff;--bd:#dcdfe2;--red:#c0392b;--ok:#1e8449;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;color:var(--brand)}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--bd);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:.25rem;font-weight:600}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.acc{background:var(--acc)}
.btn.sec{background:var(--brand-l);color:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--bd)}
.btn.red{background:#fdecea;color:var(--red)}
.btn.sm{padding:.35rem .65rem;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:.85rem}
.tag{display:inline-block;background:var(--acc-l);color:var(--acc);padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:700}
.stat b{display:block;font-size:1.8rem;color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--bd);font-size:.9rem}
th{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.pill{cursor:pointer}
details{border:1px solid var(--bd);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0;background:#fafafa}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
.shell{display:flex;min-height:100vh}
aside{width:240px;background:var(--brand);color:#dbe7ef;padding:1rem .8rem;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;color:#fff;padding:.3rem .5rem 1rem;font-size:1.05rem}
.logo svg{width:28px;height:28px;stroke:#fff}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .7rem;border-radius:10px;color:#dbe7ef;cursor:pointer;margin-bottom:2px}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--acc);color:#fff}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;background:#fff;border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:5}
.burger{display:none;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--brand)}
main{padding:1.2rem;max-width:1100px;margin:0 auto}
.scrim{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--brand-d),var(--brand) 65%,var(--acc) 160%)}
.auth .box{background:#fff;border-radius:20px;padding:1.5rem;width:100%;max-width:460px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:1rem}
.tabs button{flex:1;border:0;background:none;padding:.55rem;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin:.5rem 0}
.bar{height:8px;background:#e6e8ea;border-radius:9px;overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--acc)}
.meal{border:1px solid var(--bd);border-radius:12px;padding:.8rem;margin-bottom:.8rem;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand-d);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ck{display:flex;gap:.5rem;padding:.35rem 0;font-size:.9rem}
.ck b{width:1.2rem;text-align:center}.ck .y{color:var(--ok)}.ck .w{color:var(--acc)}.ck .n{color:var(--mut)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-size:.8rem;cursor:pointer;font-weight:600}
.pwm{font-size:.78rem;margin-top:.2rem}
.printonly{display:none}
@media(max-width:820px){
 aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.2s}
 .shell.open aside{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
 .burger{display:block}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .g4.keep{grid-template-columns:repeat(2,1fr)}
 main{padding:.9rem}
}
@media print{
 aside,.top,.noprint,.scrim,.toast,.screenonly{display:none!important}
 .printonly{display:block!important}
 body{background:#fff}main{padding:0;max-width:none}
 .pr h1{font-size:1.3rem}.pr table th,.pr table td{border:1px solid #999}
}
.modal{position:fixed;inset:0;background:rgba(20,58,85,.6);z-index:40;display:grid;place-items:center;padding:1rem}
.mbox{background:#fff;border-radius:18px;padding:1.4rem;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:5px solid var(--acc)}
.notice{background:var(--brand-l);color:var(--brand-d);border-left:4px solid var(--brand);border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem;font-size:.9rem}
.pt{min-height:100vh;background:var(--bg)}
.pthead{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:2rem 1.2rem 3.2rem;border-bottom:5px solid var(--acc)}
.ptwrap{max-width:720px;margin:-2rem auto 2rem;padding:0 1rem}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.chip{background:#fff;border-radius:14px;padding:.7rem;text-align:center;border:1px solid var(--bd)}
.chip b{display:block;font-size:1.25rem;color:var(--acc)}
.ptmeal{display:flex;gap:.9rem;background:#fff;border-radius:16px;padding:1rem;margin-bottom:.8rem;border:1px solid var(--bd)}
.pttime{min-width:56px;text-align:center;font-weight:700;color:var(--brand);border-right:3px solid var(--acc);padding-right:.7rem}
@media(max-width:820px){.chips{grid-template-columns:repeat(2,1fr)}}
.mbox.full{max-width:640px;height:92vh;display:flex;flex-direction:column}
.pklist{overflow:auto;flex:1;margin-top:.4rem}
.chips2{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0}
.chip2{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:.3rem .85rem;font-size:.86rem;cursor:pointer;flex-shrink:0}
.chip2.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.gauge{display:flex;height:10px;border-radius:99px;position:relative;margin:.5rem 0;background:#eee}
.gauge span{display:block;height:100%}.gauge span:first-child{border-radius:99px 0 0 99px}.gauge span:nth-last-child(2){border-radius:0 99px 99px 0}
.gauge.dim{opacity:.3}.mark{position:absolute;top:-4px;width:5px;height:18px;background:var(--ink);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px #fff;transition:left .35s}
.mchips{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0}.mchip{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;font-weight:600}
.mchip.y{background:#e3f4ea;color:#1e7a45}.mchip.w{background:#fdf3d6;color:#8a6500}.mchip.r{background:#fbe1df;color:#a93226}
.pctin{width:58px;padding:.15rem .3rem;display:inline-block;font-size:.8rem}.mbal{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed var(--bd)}
.daybar{position:sticky;top:58px;z-index:4;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:.6rem .8rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chip3{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:99px;padding:.12rem .6rem;margin:0 .3rem .3rem 0;font-size:.8rem;cursor:pointer}.chip3 b{margin-left:.35rem;color:var(--acc)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-radius:18px;padding:1.2rem;border-bottom:5px solid var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1rem}
.tile{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:1rem .6rem;text-align:center;cursor:pointer;transition:.18s}
.tile:hover,.card.pill:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(27,79,114,.15)}
.tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:0 auto .5rem}.tic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem}.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem .1rem;border-radius:12px;background:var(--bg);cursor:pointer;text-align:center}
.wd.has{background:var(--acc-l);border:1px solid var(--acc)}.wd b{font-size:1.1rem}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}.wd .small:last-child{font-size:.65rem}}
</style>
</head>

function planCalc(pl){

 const tot=meals.reduce((s,m)=>{for(const k of['k','p','c','l','f'])s[k]+=m[k];for(const n of[0,1,2,3,4])s.n[n]+=m.n[n];return s},z());

 const dev=(t.k-pl.kcal)/pl.kcal*100;out.push([Math.abs(dev)<=10?'y':'w',`Energia: ${f0(t.k)} kcal (${dev>=0?'+':''}${f1(dev)}% da meta; tolerância ±10%)`]);

 if(R){for(const[n,v,r]of[['Carboidrato',pc,R.c],['Proteína',pp,R.p],['Lipídio',pl2,R.l]])out.push([v>=r[0]&&v<=r[1]?'y':'w',`${n}: ${f1(v)}% das kcal (AMDR/DRI: ${r[0]}–${r[1]}%)`])}

 out.push([t.f>=14*t.k/1000?'y':'w',`Fibras: ${f1(t.f)} g (DRI/AI: 14 g por 1.000 kcal = ${f1(14*t.k/1000)} g)`]);
 const nm=pl.meals.filter(m=>m.items.length||(m.eq||[]).length).length;out.push([nm>=3?'y':'w',`${nm} refeição(ões) com alimentos (Guia Alimentar: pelo menos 3 refeições + lanches)`]);

 out.push([sh(4)===0?'y':'n',`Ultraprocessados (NOVA 4): ${f1(sh(4))}% das kcal. O Guia Alimentar recomenda evitar.`]);

 return out;
}

async function sealObj(obj,pin){
 const[fl,data]=await zip(JSON.stringify(obj)),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pin,salt),data)),all=new Uint8Array(29+ct.length);
 all[0]=fl;all.set(salt,1);all.set(iv,17);all.set(ct,29);return b64u(all);
}
async function openObj(s,pin){
 const all=unb64u(s),pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(17,29)},await aesKey(pin,all.slice(1,17)),all.slice(29)));
 return JSON.parse(await unzip(all[0],pt));
}

function unitsFor(f){
 const u=[['g',1]],d=densOf(f);if(d)u.push(['mL',d]);
 (f.med&&f.med.length?f.med:medOf(f)||[]).forEach(m=>u.push(m));return u;
}
const unitG=(f,u)=>(unitsFor(f).find(x=>x[0]===u)||['g',1])[1];
function pq(s){s=String(s).trim().replace(',','.');let m=s.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]/+m[2];m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]+ +m[2]/+m[3];return parseFloat(s)||0}
function fmtQ(q){const fr={0.25:'¼',0.5:'½',0.75:'¾'},w=Math.floor(q),r=+(q-w).toFixed(2);if(fr[r])return(w?w:'')+fr[r];return String(Math.round(q*100)/100).replace('.',',')}
function qtyLabel(it){const u=it.u||'g',q=it.q??it.g;return u==='g'?`${f1(it.g)} g`:u==='mL'?`${fmtQ(q)} mL`:`${fmtQ(q)} ${u} (${f0(it.g)} g)`}

function lineChart(pts,unit,color){
 if(pts.length<2)return '<p class="small mut">Registre pelo menos 2 medidas para ver a evolução.</p>';
 const W=320,H=140,pl=36,pr=14,pt=16,pb=24,xs=pts.map(p=>new Date(p.d).getTime()),ys=pts.map(p=>p.v);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.18;y0-=pd;y1+=pd;
 const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),dm=d=>{const a=d.split('-');return a[2]+'/'+a[1]};
 const line=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const last=pts[pts.length-1],first=pts[0],dl=last.v-first.v;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Evolução de ${unit}: de ${f1(first.v)} para ${f1(last.v)}">
 <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#dcdfe2"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#dcdfe2"/>
 <text x="${pl-4}" y="${Y(y1-pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y1-pd)}</text><text x="${pl-4}" y="${Y(y0+pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y0+pd)}</text>
 <text x="${pl}" y="${H-8}" font-size="9" fill="#66727c">${dm(pts[0].d)}</text><text x="${W-pr}" y="${H-8}" font-size="9" text-anchor="end" fill="#66727c">${dm(last.d)}</text>
 <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
 <text x="${X(xs[xs.length-1])}" y="${Y(last.v)-8}" font-size="10" font-weight="700" text-anchor="end" fill="${color}">${f1(last.v)} ${unit}</text></svg>
 <div class="small mut">Variação: <b style="color:${color}">${dl>0?'+':''}${f1(dl)} ${unit}</b> desde ${fdate(first.d)}</div>`;
}

function multiChart(list,unit,bands){

 const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),dm=d=>d.slice(8)+'/'+d.slice(5,7);

  return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>${s.pts.map(p=>`<circle cx="${X(new Date(p.d).getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.4" fill="#fff" stroke="${s.c}" stroke-width="2"/>`).join('')}<text x="${X(new Date(l.d).getTime())}" y="${Y(l.v)-8}" font-size="10" font-weight="700" text-anchor="end" fill="${s.c}">${f1(l.v)}</text>`}).join('');

 <text x="${pl}" y="${H-8}" font-size="9" fill="#66727c">${dm(mn)}</text><text x="${W-pr}" y="${H-8}" font-size="9" text-anchor="end" fill="#66727c">${dm(mx)}</text>${lines}</svg>${leg}

}

function rcTot(r){const t={k:0,p:0,c:0,l:0,f:0,g:0,nv:1};r.ings.forEach(i=>{const f=food(i.foodId);if(!f)return;const x=i.g/100;t.k+=f.k*x;t.p+=f.p*x;t.c+=f.c*x;t.l+=f.l*x;t.f+=(f.f||0)*x;t.g+=i.g;t.nv=Math.max(t.nv,f.nova||1)});return t}
function openRec(id){
 const f=id&&S.data.foods.find(x=>x.id===id);
 S.rc=f&&f.rec?{id:f.id,nome:f.nome,ings:JSON.parse(JSON.stringify(f.rec.ings)),rend:f.rec.rend||'',pn:f.rec.pn||'porção',pg:f.rec.pg||''}:{id:'',nome:'',ings:[],rend:'',pn:'porção',pg:''};

function saveRec(){

const EQ=[['cer','Cereais, pães e tubérculos',['Cereais e massas','Tubérculos'],150,32,3,1,1.5],
['hor','Hortaliças',['Verduras','Legumes'],15,3,1,0,1.5],
['fru','Frutas',['Frutas'],70,17,1,0.3,2],
['leg','Leguminosas',['Leguminosas'],55,9,4,0.3,5],
['car','Carnes, peixes e ovos',['Carnes','Peixes','Ovos'],100,0,15,4,0],
['lei','Leite e derivados',['Leite e derivados'],120,9,7,6,0],
['ole','Oleaginosas',['Oleaginosas'],75,3,3,6,1],
['gor','Óleos e gorduras',['Óleos e gorduras'],73,0,0,8,0],
['acu','Açúcares e doces',['Açúcares e doces'],60,15,0,0,0]];
function eqG(k){return EQ.find(x=>x[0]===k)}
function EQGET(k){const e=eqG(k);return e?{k:e[3],c:e[4],p:e[5],l:e[6],f:e[7]}:null}
function eqOpts(k){
 const e=eqG(k);if(!e)return[];
 return allFoods().filter(f=>e[2].includes(f.gr)&&f.k>=8&&(f.nova||1)<=3).map(f=>({f,g:Math.max(5,Math.round(e[3]/f.k*100/5)*5)})).filter(x=>x.g<=500).sort((a,b)=>a.f.nome.localeCompare(b.f.nome));
}
function eqN(n){return String(Math.round(n*100)/100).replace('.',',')}
function eqName(e){return eqN(e.n)+(e.n===1?' porção':' porções')+' de '+eqG(e.gr)[1].toLowerCase()}
function eqItems(m){
 return(m.eq||[]).filter(e=>eqG(e.gr)).map(e=>{const q=eqG(e.gr),kc=Math.round(q[3]*e.n);return[eqName(e),0,kc,'≈ '+kc+' kcal',eqOpts(e.gr).slice(0,12).map(x=>[x.f.nome,Math.round(x.g*e.n/5)*5]),1]});
}
function eqPrint(e){
 const q=eqG(e.gr);if(!q)return '';
 const o=eqOpts(e.gr).slice(0,12);
 return `<p><b>${esc(eqName(e))}</b> (≈ ${f0(q[3]*e.n)} kcal)<br><span class="small">Escolha uma opção: ${o.map(x=>esc(x.f.nome)+' '+Math.round(x.g*e.n/5)*5+' g').join(' · ')}</span></p>`;
}

 <div class="chips2"><span class="chip2 ${eq?'':'on'}" onclick="S.plan.modo='alim';render()">Alimentos</span><span class="chip2 ${eq?'on':''}" onclick="S.plan.modo='eq';render()">Equivalentes</span></div></div></div>`;
}
function eqList(mi,m){
 return(m.eq||[]).map((e,i)=>{
  const q=eqG(e.gr);if(!q)return '';
  const o=eqOpts(e.gr),sh=o.slice(0,14);
  return `<div class="item" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="row" style="gap:.4rem"><input inputmode="decimal" style="width:70px" value="${eqN(e.n)}" onchange="eqSet(${mi},${i},'n',this.value)"><select style="flex:1;min-width:150px" onchange="eqSet(${mi},${i},'gr',this.value)">${EQ.map(x=>`<option value="${x[0]}" ${x[0]===e.gr?'selected':''}>${x[1]}</option>`).join('')}</select></div>
  <div class="small mut" style="margin-top:.3rem">${f0(q[3]*e.n)} kcal · C ${f1(q[4]*e.n)} · P ${f1(q[5]*e.n)} · L ${f1(q[6]*e.n)} · 1 porção = ${q[3]} kcal</div>
  <details style="margin-top:.3rem"><summary class="small" style="cursor:pointer;color:var(--brand)">Ver ${o.length} equivalentes</summary><div class="small" style="margin-top:.3rem;line-height:1.7">${sh.map(x=>esc(x.f.nome)+' <b>'+Math.round(x.g*e.n/5)*5+' g</b>').join(' · ')}${o.length>sh.length?` · e mais ${o.length-sh.length}`:''}</div></details></div>
  <button class="btn sm red" onclick="eqDel(${mi},${i})">×</button></div>`}).join('');

function fRes(titulo,txt,cls){return `<div class="card" style="border-left:5px solid ${cls==='r'?'#c0392b':cls==='y'?'#e0a800':cls==='g'?'#2e7d32':'var(--brand)'}"><b>${titulo}</b><div class="small" style="margin-top:.3rem">${txt}</div></div>`}
function fFc(){
 const e=S.fe,b=num(e.pb),l=num(e.pl),cr=num(e.cru),co=num(e.coz),pr=num(e.preco);
 const fc=calcFC(b,l),ic=calcIC(cr,co);
 return `<div class="card"><h2>Fator de correção (FC) e índice de cocção (IC)</h2><p class="small mut">Técnica dietética: FC = peso bruto ÷ peso líquido (depois de limpar/descascar). IC = peso cozido ÷ peso cru.</p>
 <div class="grid g4 keep">${fIn('Peso bruto (g)','pb')}${fIn('Peso líquido (g)','pl')}${fIn('Preço do kg bruto (R$)','preco')}</div>

 <hr style="margin:1rem 0;border:0;border-top:1px solid var(--bd)"><div class="grid g4 keep">${fIn('Peso cru (g)','cru')}${fIn('Peso cozido (g)','coz')}</div>
 ${ic?`<p style="margin-top:.8rem">IC = <b>${f1(ic)}</b> — ${ic>1?'o alimento ganha peso no preparo ('+f0((ic-1)*100)+'%)':ic<1?'o alimento perde peso no preparo ('+f0((1-ic)*100)+'%)':'sem variação de peso'}.</p>`:''}</div>`;
}
function fMet(){
 const e=S.fe,peso=num(e.mp),min=num(e.mm),i=e.ma===undefined||e.ma===''?null:+e.ma;
 const kc=i!==null&&peso&&min?kcalMET(MET[i][1],peso,min):null;
 return `<div class="card"><h2>Gasto energético de atividades (MET)</h2><p class="small mut">kcal ≈ MET × peso (kg) × horas. Valores de MET aproximados, baseados no Compêndio de Atividades Físicas; servem como estimativa.</p>
 <div class="grid g3">${fSel('Atividade','ma',MET.map(m=>m[0]+' — '+String(m[1]).replace('.',',')+' MET'))}${fIn('Peso (kg)','mp')}${fIn('Duração (minutos)','mm')}</div></div>
 ${kc?fRes('Gasto estimado: '+f0(kc)+' kcal','Esse valor inclui o gasto de repouso do período. Para saber só o gasto adicional da atividade, use (MET − 1) no cálculo.'):''}`;
}

function saveProfile(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 ['nome','inst','periodo','orient','crn'].forEach(k=>{if(f[k])u[k]=f[k].value.trim()});LS.set('nd_users',users);S.user=u;toast('Perfil salvo');render();
}
async function changePass(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 if(u.hash!==await hash(f.atual.value,u.salt))return amsg('Senha atual incorreta.');
 if(!pwOk(f.nova.value))return amsg('A nova senha precisa de 8+ caracteres, com letras e números.');
 if(f.nova.value!==f.nova2.value)return amsg('As senhas não conferem.');
 u.hash=await hash(f.nova.value,u.salt);LS.set('nd_users',users);S.user=u;pushMsg(u.id,'redefinida',u);toast('Senha alterada. Deixamos um aviso na sua caixa de mensagens.');e.target.reset();
}
function exportData(){
 const b=new Blob([JSON.stringify({v:2,data:S.data},null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='backup-'+today()+'.json';a.click();localStorage.setItem('nd_lb_'+S.user.id,today());
}
function importData(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data||!Array.isArray(j.data.patients))throw 0;if(!confirm('Isso substitui os dados atuais. Continuar?'))return;S.data=Object.assign(emptyData(),j.data);save();toast('Backup restaurado');render()}catch(e){toast('Arquivo inválido.')}};
 r.readAsText(f);
}
function delAccount(){
 if(!confirm('Excluir sua conta e TODOS os dados? Não dá para desfazer.'))return;
 LS.set('nd_users',LS.get('nd_users',[]).filter(u=>u.id!==S.user.id));localStorage.removeItem('nd_data_'+S.user.id);localStorage.removeItem('nd_snap_'+S.user.id);localStorage.removeItem('nd_lb_'+S.user.id);logout();
}

const PREPS=['Cru','Cozido','Grelhado','Assado','Frito','Refogado','Torrado','Em conserva','Industrializado','Preparação caseira','Não se aplica','Não informado'];
/* nutrientes opcionais (por 100 g). Valor ausente = desconhecido, nunca zero. */
const MICDEF=[['na','Sódio','mg'],['pot','Potássio','mg'],['ca','Cálcio','mg'],['mg','Magnésio','mg'],['fosf','Fósforo','mg'],['fe','Ferro','mg'],['zn','Zinco','mg'],['cu','Cobre','mg'],['mn','Manganês','mg'],['se','Selênio','µg'],['va','Vitamina A (RAE)','µg'],['ret','Retinol','µg'],['tia','Tiamina (B1)','mg'],['rib','Riboflavina (B2)','mg'],['nia','Niacina (B3)','mg'],['pir','Vitamina B6','mg'],['fol','Folato (DFE)','µg'],['b12','Vitamina B12','µg'],['vc','Vitamina C','mg'],['vd','Vitamina D','µg'],['ve','Vitamina E','mg'],['col','Colesterol','mg'],['sat','Gordura saturada','g']];
const MICK=MICDEF.map(x=>x[0]);

/* grupos (organização pedida: cereais, frutas, verduras, legumes, carnes, ovos, leite, leguminosas, óleos, industrializados) */
GRUPOS.length=0;
['Cereais e massas','Tubérculos','Leguminosas','Verduras','Legumes','Frutas','Carnes','Peixes','Ovos','Leite e derivados','Óleos e gorduras','Oleaginosas','Açúcares e doces','Bebidas','Industrializados','Preparações','Suplementos','Outros'].forEach(g=>GRUPOS.push(g));
function nzs(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
const VERD=/alface|couve|rucula|agriao|espinafre|repolho|acelga|chicoria|almeirao|brocolis|salada|mostarda|taioba|catalonha|escarola|folha/;
function remapGr(gr,nome){
 if(gr==='Hortaliças')return VERD.test(nzs(nome))?'Verduras':'Legumes';
 if(gr==='Carnes e ovos')return /\bovo|omelete|clara|gema/.test(nzs(nome))?'Ovos':'Carnes';
 return gr;
}
const medOf=f=>MEDN[f.nome]||MEDN[MEDEQ[f.nome]]||null;
function normFood(f){f.gr=remapGr(f.gr,f.nome);['p','c','l'].forEach(k=>{if(f[k]===undefined||f[k]===null||(typeof f[k]==='number'&&isNaN(f[k]))){f.unk=f.unk||[];if(!f.unk.includes(k))f.unk.push(k);f[k]=0}});return f}
const unkOf=(f,k)=>(f.unk||[]).includes(k);
function mapGrupo(txt,nome){
 const t=nzs(txt);if(!t)return null;
 const ex=GRUPOS.find(g=>nzs(g)===t);if(ex)return ex;
 if(/cereal|massa|pao|farinha/.test(t))return 'Cereais e massas';
 if(/verdura|hortalica|legume/.test(t))return VERD.test(nzs(nome))?'Verduras':'Legumes';
 if(/fruta/.test(t))return 'Frutas';
 if(/gordura|oleo/.test(t))return 'Óleos e gorduras';
 if(/pescado|peixe|fruto do mar/.test(t))return 'Peixes';
 if(/carne|\baves?\b/.test(t))return 'Carnes';
 if(/leite|laticin|queijo|iogurte/.test(t))return 'Leite e derivados';
 if(/bebida/.test(t))return 'Bebidas';
 if(/\bovo/.test(t))return 'Ovos';
 if(/acucar|doce/.test(t))return 'Açúcares e doces';
 if(/leguminosa|feij/.test(t))return 'Leguminosas';
 if(/noz|semente|oleaginosa|castanha/.test(t))return 'Oleaginosas';
 if(/industrializ|miscelan/.test(t))return 'Industrializados';
 if(/preparad|preparac/.test(t))return 'Preparações';
 if(/tuberculo|raiz/.test(t))return 'Tubérculos';
 if(/suplement/.test(t))return 'Suplementos';
 return null;
}
function inferPrep(nome,gr){
 const t=nzs(nome);
 if(/\bcozid|\bfervid/.test(t))return 'Cozido';if(/grelhad/.test(t))return 'Grelhado';if(/assad/.test(t))return 'Assado';
 if(/\bfrit/.test(t))return 'Frito';if(/refogad/.test(t))return 'Refogado';if(/torrad/.test(t))return 'Torrado';
 if(/\bcru\b|\bcrua\b|\bcrus\b|\bcruas\b/.test(t))return 'Cru';if(/conserva|ao natural|em calda/.test(t))return 'Em conserva';
 if(['Frutas','Verduras','Legumes'].includes(gr))return 'Cru';
 if(['Industrializados','Suplementos'].includes(gr))return 'Industrializado';
 if(['Oleaginosas','Óleos e gorduras','Açúcares e doces','Leite e derivados','Bebidas'].includes(gr))return 'Não se aplica';
 return 'Não informado';
}
const FIBGR=['Frutas','Verduras','Legumes','Leguminosas','Tubérculos','Oleaginosas'];
/* migração do banco base: fonte, estado de preparo, referência, e fibra zero em grupos que sempre têm fibra vira "desconhecida" */
BASE.forEach(f=>{
 normFood(f);f.fonte='est';f.ref='100 g';f.prep=inferPrep(f.nome,f.gr);f.prepInf=true;
 if(f.f===0&&FIBGR.includes(f.gr)){f.f=undefined}
});
/* TACO embutida (dados em p20d.js) */
TACO_DATA.forEach(r=>{const o={};TACO_COLS.forEach((c,i)=>o[c]=r[i]);o.va=o.rae;
 const f={id:'t'+o.n,nome:o.nome,gr:o.gr,prep:o.prep,nova:o.nova||undefined,novaInf:!!o.novaInf,k:o.k,p:o.p===null?undefined:o.p,c:o.c===null?undefined:o.c,l:o.l===null?undefined:o.l,f:o.f===null?undefined:o.f,m:{},fonte:'taco',ref:'100 g',base:true};
 MICK.forEach(k=>{if(o[k]!==undefined&&o[k]!==null)f.m[k]=o[k]});BASE.push(normFood(f))});
/* densidades (g/mL) para converter volume em massa: só alimentos listados. Valores aproximados. */
const DENS={'Água':1,'Chá sem açúcar':1,'Café coado sem açúcar':1,'Leite integral':1.03,'Leite desnatado':1.03,'Leite semidesnatado':1.03,'Bebida de soja':1.03,'Água de coco':1.01,'Suco de laranja natural':1.04,'Suco de uva integral':1.05,'Refrigerante de cola':1.04,'Azeite de oliva':0.91,'Óleo de soja':0.92,'Leite, de vaca, integral':1.03,'Leite, de vaca, desnatado, UHT':1.03,'Óleo, de soja':0.92,'Óleo, de canola':0.92,'Óleo, de girassol':0.92,'Óleo, de milho':0.92,'Azeite, de oliva, extra virgem':0.91,'Coco, água de':1.01};
function densOf(f){return f.dens||DENS[f.nome]||null}

/* ===== validação ===== */
function pn(s){s=String(s??'').trim();if(s==='')return undefined;const v=parseFloat(s.replace(/\./g,m=>/,/.test(s)?'':'.').replace(',','.'));return isNaN(v)?NaN:v}
function validaFood(f){
 const er=[],av=[],n=x=>typeof x==='number'&&!isNaN(x),miss=k=>f[k]===undefined||f[k]===null||(typeof f[k]==='number'&&isNaN(f[k]))||(f.unk||[]).includes(k);
 if(!String(f.nome||'').trim())er.push('Nome ausente.');
 if(!GRUPOS.includes(f.gr))er.push('Grupo inválido ou ausente.');
 if(miss('k'))er.push('Energia: valor ausente ou inválido (alimento sem energia não pode entrar em plano).');else if(f.k<0)er.push('Energia: valor negativo.');
 [['p','Proteína'],['c','Carboidrato'],['l','Lipídio']].forEach(([k,l])=>{if(miss(k))av.push(l+' não informado(a): fica desconhecido e não entra na soma.');else if(f[k]<0)er.push(l+': valor negativo.')});
 if(f.f!==undefined&&(!n(f.f)||f.f<0))er.push('Fibra: valor inválido.');
 MICK.forEach(k=>{const v=(f.m||{})[k];if(v!==undefined&&(!n(v)||v<0))er.push('Nutriente '+k+': valor inválido.')});
 if(n(f.k)&&f.k>900)er.push('Energia acima de 900 kcal/100 g (impossível).');
 if(!miss('p')&&!miss('c')&&!miss('l')){
  const s=f.p+f.c+f.l;if(s>100.5)er.push('Proteína + carboidrato + lipídio somam '+s.toFixed(1)+' g em 100 g.');
  const calc=4*f.p+4*f.c+9*f.l;if(n(f.k)&&Math.abs(f.k-calc)>Math.max(20,0.25*f.k))av.push('Energia ('+f.k+' kcal) difere do calculado pelos macros ('+Math.round(calc)+' kcal).');
  if(n(f.f)&&f.f>f.c+0.5)av.push('Fibra maior que o carboidrato total.');
 }
 if(f.f===undefined)av.push('Fibra não informada.');
 if(((f.m||{}).na)===undefined)av.push('Sódio não informado.');
 if(!f.nova)av.push('Classificação NOVA não informada.');
 else if(f.novaInf)av.push('NOVA inferida pelo sistema: confirme.');
 if(!f.prep||f.prep==='Não informado')av.push('Estado de preparo não informado.');
 if(fonteDe(f)==='est')av.push('Valor estimado, não conferido com tabela oficial.');
 return{er,av};
}
function chaveFood(f){return nzs(f.nome)+'|'+nzs(f.prep||'')}
function auditoria(){
 const l=allFoods(),m={},ids={};const out=l.map(f=>({f,...validaFood(f),dup:false}));
 out.forEach(r=>{const k=chaveFood(r.f);(m[k]=m[k]||[]).push(r);(ids[r.f.id]=ids[r.f.id]||[]).push(r)});
 Object.values(m).forEach(a=>{if(a.length<2)return;
  const tc=a.filter(r=>r.f.fonte==='taco'),es=a.filter(r=>r.f.fonte==='est');
  if(tc.length===1&&es.length===a.length-1){es.forEach(r=>r.av.push('Estimativa com equivalente na TACO ("'+tc[0].f.nome+'"): prefira o item da TACO.'));return}
  a.forEach(r=>{r.dup=true;r.er.push('Duplicado: mesmo nome e preparo de outro alimento.')})});
 Object.values(ids).forEach(a=>{if(a.length>1)a.forEach(r=>{r.dup=true;r.er.push('Identificador repetido.')})});
 return out;
}

function parseCSV(t){
 t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'',cnt=c=>first.split(c).length-1,d=cnt(';')>=cnt('\t')&&cnt(';')>=cnt(',')?';':cnt('\t')>cnt(',')?'\t':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else cur+=ch}
 if(cur!==''||row.length){row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row)}
 return rows;
}

 ['k','Energia (kcal)',['energia kcal','energia','kcal','calorias','valor energetico','energia kcal 100g']],['p','Proteína (g)',['proteina','proteina g','proteinas']],['c','Carboidrato (g)',['carboidrato','carboidrato g','carboidratos','carboidrato total']],['l','Lipídio (g)',['lipidios','lipideos','lipidio','lipideo','lipidios g','lipideos g','gordura total','gorduras totais']],['f','Fibra (g)',['fibra alimentar','fibra','fibras','fibra alimentar g']],
 ['unid','Unidade de referência (g ou mL)',['unidade','por','unidade de referencia','referencia']],['dens','Densidade (g/mL)',['densidade']],
 ...[['na',['sodio','sodio mg']],['pot',['potassio','potassio mg']],['ca',['calcio','calcio mg']],['mg',['magnesio','magnesio mg']],['fosf',['fosforo','fosforo mg']],['fe',['ferro','ferro mg']],['zn',['zinco','zinco mg']],['cu',['cobre','cobre mg']],['mn',['manganes','manganes mg']],['se',['selenio']],['va',['rae','vitamina a rae','vitamina a','va']],['ret',['retinol']],['tia',['tiamina','vitamina b1']],['rib',['riboflavina','vitamina b2']],['nia',['niacina','vitamina b3']],['pir',['piridoxina','vitamina b6']],['fol',['folato','acido folico','folato dfe']],['b12',['vitamina b12','cobalamina','b12']],['vc',['vitamina c','vit c']],['vd',['vitamina d','vit d']],['ve',['vitamina e','alfa tocoferol']],['col',['colesterol','colesterol mg']],['sat',['saturados','acidos graxos saturados','gordura saturada']]].map(x=>[x[0],MICDEF.find(m=>m[0]===x[0])[1]+' ('+MICDEF.find(m=>m[0]===x[0])[2]+')',x[1]])];
function impAutoMap(head){const hn=head.map(nzs),map={};IMPF.forEach(([k,,syn])=>{const i=hn.findIndex(h=>!/\bkj\b/.test(h)&&syn.includes(h));if(i>=0)map[k]=i});return map}

function importFile(inp){
 const file=inp.files[0];if(!file)return;
 const go1=enc=>{const r=new FileReader();r.onload=()=>{
  if(enc==='utf-8'&&r.result.includes('�'))return go1('windows-1252');
  const rows=parseCSV(r.result);if(rows.length<2)return toast('Arquivo vazio ou sem linhas de dados.');
  const head=rows[0].map(x=>x.trim()),map=impAutoMap(head);
  S.imp={arq:file.name,rows:rows.slice(1),head,map,fonte:'taco',versao:'',data:today(),obs:'',dup:'pular',res:null};
  S.fa.tab='imp';impBuild();render();
 };r.readAsText(file,enc)};go1('utf-8');inp.value='';
}
function pv(s){
 s=String(s??'').trim();if(s===''||/^(na|nd|n\.d\.|\*|-|—|–)$/i.test(s))return{v:undefined};
 if(/^tr$/i.test(s))return{v:0,tr:true};
 let x=s.replace(/\s/g,'');if(x.includes(',')&&x.includes('.'))x=x.replace(/\./g,'');x=x.replace(',','.');
 const v=Number(x);return isNaN(v)?{v:NaN}:{v};
}
function impBuild(){
 const I=S.imp,res=[],seen={},ex={};allFoods().forEach(f=>{ex[chaveFood(f)]=f});
 const g=(r,k)=>I.map[k]===undefined?'':(r[I.map[k]]||'');
 I.rows.forEach((r,i)=>{
  const er=[],av=[];const f={m:{},nome:g(r,'nome').trim(),ref:'100 g'};
  const gt=g(r,'gr');f.gr=mapGrupo(gt,f.nome);if(!f.gr){av.push('Grupo "'+gt+'" não reconhecido: ficou em "Outros".');f.gr='Outros'}
  const pp=nzs(g(r,'prep'));f.prep=PREPS.find(x=>nzs(x)===pp)||inferPrep(f.nome,f.gr);if(!PREPS.find(x=>nzs(x)===pp)&&I.map.prep!==undefined&&pp)av.push('Preparo "'+g(r,'prep')+'" não reconhecido: inferido do nome.');if(I.map.prep===undefined)f.prepInf=true;
  const nv=+g(r,'nova');f.nova=[1,2,3,4].includes(nv)?nv:undefined;
  let tr=0;
  const num1=(k)=>{const x=pv(g(r,k));if(x.tr)tr++;return x.v};
  f.k=num1('k');f.p=num1('p');f.c=num1('c');f.l=num1('l');f.f=num1('f');
  MICK.forEach(k=>{const v=I.map[k]===undefined?undefined:num1(k);if(v!==undefined)f.m[k]=v});
  const un=nzs(g(r,'unid'));
  if(un==='ml'){const d=pv(g(r,'dens')).v;if(!d||isNaN(d)||d<=0)er.push('Valores por 100 mL exigem densidade (g/mL).');else{['k','p','c','l','f'].forEach(k=>{if(typeof f[k]==='number')f[k]=f[k]/d});Object.keys(f.m).forEach(k=>f.m[k]=f.m[k]/d);f.dens=d;av.push('Convertido de 100 mL para 100 g usando densidade '+d+'.')}}
  else if(I.map.dens!==undefined){const d=pv(g(r,'dens')).v;if(d>0)f.dens=d}
  const v=validaFood({...f,fonte:'x'});
  er.push(...v.er);av.push(...v.av.filter(x=>!/estimado|não conferido|não informad|Fibra não|Sódio não|NOVA não/.test(x)));
  if(tr)av.push(tr+' valor(es) "Tr" (traço) gravado(s) como 0.');
  const key=chaveFood(f);let dup=null;
  if(f.nome){if(ex[key])dup='existente';else if(seen[key])dup='arquivo';seen[key]=true}
  res.push({i,f,er,av,dup,key});
 });
 I.res=res;
}

/* ===== FÓRMULAS: funções puras (testáveis), registro e validação ===== */
const SIRI=D=>(4.95/D-4.5)*100;
function dJP3(M,s,A){return M?1.10938-0.0008267*s+0.0000016*s*s-0.0002574*A:1.0994921-0.0009929*s+0.0000023*s*s-0.0001392*A}
function dJP7(M,s,A){return M?1.112-0.00043499*s+0.00000055*s*s-0.00028826*A:1.097-0.00046971*s+0.00000056*s*s-0.00012828*A}
const gcFaulkner=s=>s*0.153+5.783;
function gcNavy(M,cin,pesc,alt,quad){return M?86.010*Math.log10(cin-pesc)-70.041*Math.log10(alt)+36.76:163.205*Math.log10(cin+quad-pesc)-97.684*Math.log10(alt)-78.387}
const gcDeur=(imc,A,M)=>1.2*imc+0.23*A-10.8*(M?1:0)-5.4;
const piDevine=(M,ex)=>M?50+2.3*ex:45.5+2.3*ex;
const piHamwi=(M,ex)=>M?48+2.7*ex:45.5+2.3*ex;
const piLorentz=(M,H)=>M?H-100-(H-150)/4:H-100-(H-150)/2;
const piRobinson=(M,ex)=>M?52+1.9*ex:49+1.7*ex;
const piMiller=(M,ex)=>M?56.2+1.41*ex:53.1+1.36*ex;
function pesoAjustado(peso,Hm){const pi=22*Hm*Hm;return pi+0.25*(peso-pi)}
function riscoCintura(M,c){return M?(c>=102?'risco muito aumentado':c>=94?'risco aumentado':'sem risco'):(c>=88?'risco muito aumentado':c>=80?'risco aumentado':'sem risco')}
const kcalMET=(met,kg,min)=>met*kg*min/60;
const calcFC=(b,l)=>b&&l?b/l:null,calcIC=(cru,coz)=>cru&&coz?coz/cru:null;
function mustScore(pa,ph,al,doe){
 const r={imc:null,perda:null,s1:null,s2:null,s3:doe===undefined||doe===null?null:doe?2:0};
 if(pa&&al){r.imc=pa/Math.pow(al/100,2);r.s1=r.imc>20?0:r.imc>=18.5?1:2}
 if(pa&&ph){r.perda=(ph-pa)/ph*100;r.s2=r.perda<5?0:r.perda<=10?1:2}
 r.tot=r.s1!==null&&r.s2!==null&&r.s3!==null?r.s1+r.s2+r.s3:null;return r;
}
/* MNA-SF: a..e = índice da resposta; f = pontos do IMC (índice) ou null; cp = circunferência da panturrilha (cm) */
function mnaScore(a,b,c,d,e,f,cp){
 const A=[0,1,2],B=[0,1,2,3],C=[0,1,2],D=[0,2],E=[0,1,2],F=[0,1,2,3];
 let pf=null;if(cp){pf=cp<31?0:3}else if(f!==null)pf=F[f];
 const p=[a===null?null:A[a],b===null?null:B[b],c===null?null:C[c],d===null?null:D[d],e===null?null:E[e],pf];
 return p.every(x=>x!==null&&x!==undefined)?p.reduce((s,x)=>s+x,0):null;
}
const mnaCls=t=>t>=12?'normal':t>=8?'risco':'desnutrido';

/* ===== validação de entradas ===== */
function validar(o){
 const er=[];
 if(!(o.idade>0&&o.idade<=120))er.push('Idade deve estar entre 0 e 120 anos.');
 if(!(o.peso>=2&&o.peso<=400))er.push('Peso deve estar entre 2 e 400 kg.');
 if(!(o.altura>=40&&o.altura<=250))er.push('Altura deve estar entre 40 e 250 cm.');
 if(o.gc&&!(o.gc>=2&&o.gc<=70))er.push('% de gordura deve estar entre 2 e 70.');
 if(o.mlg&&!(o.mlg>=1&&o.mlg<o.peso))er.push('Massa livre de gordura inconsistente com o peso.');
 return er;
}
const LIMMED={cintura:[30,250],quadril:[40,250],pescoco:[15,80],braco:[8,80],joelho:[20,80],pusual:[2,400],dtri:[1,80],dsub:[1,80],dsup:[1,80],dabd:[1,80],dpei:[1,80],daxi:[1,80],dcox:[1,80]};
function validaMed(c){
 const er=[];Object.keys(LIMMED).forEach(k=>{if(c[k]!==undefined&&c[k]!==''){const v=num(c[k]);if(v<LIMMED[k][0]||v>LIMMED[k][1])er.push(k+': valor fora do intervalo plausível ('+LIMMED[k][0]+' a '+LIMMED[k][1]+').')}});return er;
}
function energyList(o){
 if(!o.peso||!o.altura||!o.idade)return[];
 if(validar(o).length)return[];
 return energyList0(o);
}
function dadosUsados(o,idm){
 const m=TMBM.find(x=>x.id===idm),af={sed:'sedentário',leve:'leve',mod:'moderado',int:'intenso',mint:'muito intenso'}[o.af]||o.af;
 return `<p class="small mut" style="margin-top:.5rem">Dados considerados: sexo ${o.sexo==='M'?'masculino':'feminino'}, ${o.idade} anos, peso ${f1(o.peso)} kg, altura ${f1(o.altura)} cm, atividade ${af}${o.mlg?', massa livre de gordura '+f1(o.mlg)+' kg':''}${o.cond!=='none'?', condição: gestação/lactação':''}.</p>`;
}
function metaInfo(pl){
 const p=pat(pl.patientId);if(!p)return '';
 const el=energyList(patInput(p)),r=el.find(x=>x.id===pl.metodo),a=lastAval(p),o=patInput(p);
 if(!r||!r.g)return `<p class="small mut">Sem cálculo disponível para esta fórmula com os dados atuais do paciente.</p>`;
 return `<p class="small mut">Estimativa pela fórmula <b>${esc(r.n)}</b>${r.fa?' × fator de atividade '+String(r.fa).replace('.',','):''} = ${f0(r.g)} kcal, mais ajuste de ${f0(num(pl.ajuste))} kcal. Dados: ${o.sexo==='M'?'masculino':'feminino'}, ${o.A} anos, peso ${f1(o.peso)} kg, altura ${f1(o.altura)} cm${a?' (avaliação de '+fdate(a.data)+')':''}. É uma estimativa, não uma medida.</p>`;
}

/* ===== UNIDADES E CONVERSÕES ===== */
const UN_MASSA={g:1,kg:1000,mg:0.001,'µg':0.000001},UN_VOL={mL:1,L:1000};
/* converte entre unidades de massa ou entre unidades de volume. Massa <-> volume só com a densidade (g/mL) do alimento. */
function conv(v,de,para,dens){
 if(de===para)return v;
 const m1=UN_MASSA[de],m2=UN_MASSA[para],v1=UN_VOL[de],v2=UN_VOL[para];
 if(m1&&m2)return v*m1/m2;
 if(v1&&v2)return v*v1/v2;
 if((m1&&v2)||(v1&&m2)){
  if(!(dens>0))throw new Error('Conversão entre massa e volume exige a densidade do alimento (g/mL).');
  return m1?v*m1/dens/v2:v*v1*dens/m2;
 }
 throw new Error('Unidade desconhecida: '+de+' → '+para);
}
/* texto "quantidade original → quantidade convertida" para a linha do item */
function convTxt(it,f){
 const u=it.u||'g';if(u==='g'||!f)return '';
 const q=it.q??it.g,d=densOf(f);
 if(u==='mL')return `<div class="small mut">${fmtQ(q)} mL × densidade ${String(d).replace('.',',')} g/mL = ${f1(it.g)} g</div>`;
 const ug=unitG(f,u);
 return `<div class="small mut">${fmtQ(q)} × ${u} (${f1(ug)} g cada) = ${f1(it.g)} g</div>`;
}

/* Conferência de micronutrientes do plano (DRI) – só mostra quando há dados em todos os itens */
const MICMAP={'Cálcio (mg)':'ca','Ferro (mg)':'fe','Zinco (mg)':'zn','Magnésio (mg)':'mg','Vitamina C (mg)':'vc','Vitamina A (µg RAE)':'va','Vitamina D (µg)':'vd','Folato (µg DFE)':'fol','Vitamina B12 (µg)':'b12','Potássio (mg)':'pot','Sódio (mg)':'na','Sódio – limite CDRR (mg)':'na'};
function microSoma(pl){
 const r={};let n=0;
 pl.meals.forEach(m=>m.items.forEach(it=>{const f=food(it.foodId);if(!f)return;n++;
  for(const k of new Set(Object.values(MICMAP))){const v=f.m&&f.m[k];if(v===undefined||v===null||isNaN(v))continue;const o=r[k]||(r[k]={s:0,n:0});o.s+=v*it.g/100;o.n++}
 }));
 return{r,n};
}
function microCard(pl){
 const p=pat(pl.patientId);if(pl.rec||!p)return '';
 const o=patInput(p),tem=pl.meals.some(m=>m.items.length);if(!tem)return '';
 const dri=driMicro(o.sexo,o.A,o.cond);
 if(!dri.length)return `<div class="card"><h2>Micronutrientes (DRI)</h2><p class="small mut">Sem referência de micronutrientes para menores de 1 ano neste sistema.</p></div>`;
 const {r,n}=microSoma(pl),eqN=pl.meals.reduce((s,m)=>s+(m.eq||[]).length,0);
 const ctx=`${o.sexo==='F'?'mulher':'homem'}, ${GR[grp(o.A)]}${o.sexo==='F'&&o.cond&&o.cond[0]==='g'?', gestante':o.sexo==='F'&&o.cond&&o.cond[0]==='l'?', lactante':''}`;
 const rows=dri.map(d=>{
  const k=MICMAP[d[0]],a=r[k],ok=a&&a.n===n;
  if(!ok)return `<tr><td>${esc(d[0])}</td><td class="mut">sem dados suficientes (${a?a.n:0} de ${n} itens têm este nutriente)</td><td>${f1(d[1])} <span class="small mut">${d[2]}</span></td><td></td></tr>`;
  const pc=a.s/d[1]*100,lim=d[2]==='Limite';
  const st=lim?(a.s<=d[1]?['y','dentro do limite']:['w','acima do limite']):(d[2]==='AI'?(pc>=100?['y','≥ AI']:['w','abaixo da AI']):(pc>=100?['y','atinge a RDA']:['w','abaixo da RDA']));
  return `<tr><td>${esc(d[0])}</td><td>${f1(a.s)}</td><td>${f1(d[1])} <span class="small mut">${d[2]}</span></td><td><b class="${st[0]}">${f0(pc)}% · ${st[1]}</b></td></tr>`;
 }).join('');
 return `<div class="card"><h2>Micronutrientes (DRI)</h2><p class="small mut">Referência: ${ctx}. Só é mostrado o total quando todos os alimentos do plano têm o nutriente informado; valores ausentes não são tratados como zero.${eqN?' Equivalentes não entram nesta soma (não têm micronutrientes).':''}</p><div style="overflow:auto"><table><tr><th>Nutriente</th><th>Plano</th><th>Referência</th><th>Situação</th></tr>${rows}</table></div><p class="small mut">RDA e AI são metas de ingestão para pessoas saudáveis do grupo; a CDRR do sódio é um limite. A adequação individual precisa de avaliação clínica.</p></div>`;
}

/* Painel de testes */
function rodarTestes(){
 const out=TESTES.map(t=>{let v,er='';try{v=t[1]()}catch(e){er=String(e.message||e)}
  const tol=t[3]||0,ok=!er&&typeof v==='number'&&Math.abs(v-t[2])<=tol+1e-12;
  return{n:t[0],ok,v:er?'erro: '+er:v,e:t[2]}});
 S.tr={out,ok:out.filter(x=>x.ok).length,t:new Date().toLocaleString('pt-BR')};return S.tr;
}

/* ===== 2.1 ANÁLISE NUTRICIONAL DO PLANO ===== */
const DRIK=['na','pot','ca','fe','zn','mg','vc','va','vd','fol','b12'];
const NUT=[{k:'k',n:'Energia',u:'kcal',g:'mac'},{k:'p',n:'Proteína',u:'g',g:'mac'},{k:'c',n:'Carboidrato',u:'g',g:'mac'},{k:'l',n:'Lipídio',u:'g',g:'mac'},{k:'f',n:'Fibra alimentar',u:'g',g:'mac'}]
 .concat(DRIK.map(k=>{const d=MICDEF.find(x=>x[0]===k);return{k,n:d[1],u:d[2],g:'dri'}}))
 .concat(MICDEF.filter(x=>!DRIK.includes(x[0])).map(d=>({k:d[0],n:d[1],u:d[2],g:'out'})));
const nutInfo=k=>NUT.find(x=>x.k===k);
const MAXK={na:1,sat:1,col:1};           /* nutrientes cuja referência é um limite (não uma meta) */
/* valor de um nutriente em 100 g do alimento: número ou undefined (desconhecido, nunca zero) */
function nv100(f,k){
 if(!f)return undefined;
 if(k==='k')return f.k;
 if(k==='p'||k==='c'||k==='l')return unkOf(f,k)?undefined:f[k];
 if(k==='f')return f.f;
 const v=f.m&&f.m[k];return v===undefined||v===null||isNaN(v)?undefined:v;
}
/* linhas de uma refeição: alimentos + equivalentes, com o valor de cada nutriente (ou undefined) */
function rowsRef(m){
 const r=[];
 (m.items||[]).forEach((it,ii)=>{const f=food(it.foodId);if(!f)return;r.push({ii,id:f.id,nome:f.nome,g:it.g,q:qtyLabel(it),get:k=>{const v=nv100(f,k);return v===undefined?undefined:v*it.g/100}})});
 (m.eq||[]).forEach(e=>{const q=EQGET(e.gr);if(!q)return;r.push({eq:1,nome:'Equivalente: '+eqName(e),g:null,q:e.n+' porção(ões)',get:k=>q[k]===undefined||isNaN(q[k])||'kcpclf'.indexOf(k)<0?undefined:q[k]*e.n})});
 return r;
}
function somaRows(rows,k){let v=0,nd=0;rows.forEach(r=>{const x=r.get(k);if(x!==undefined){v+=x;nd++}});return{v,n:rows.length,nd,ok:rows.length>0&&nd===rows.length}}
const rowsDia=pl=>pl.meals.reduce((a,m)=>a.concat(rowsRef(m)),[]);
/* metas do dia: personalizadas (definidas pelo profissional) ou de referência (DRI) */
function metasDia(pl,p){
 const M={},tol=pl.tol==null?10:pl.tol,cu=pl.metas||{};
 const g={k:pl.kcal,c:pl.kcal*pl.pc/100/4,p:pl.kcal*pl.pp/100/4,l:pl.kcal*pl.pl/100/9};
 for(const k of['k','c','p','l'])M[k]={v:g[k],tipo:'meta',modo:'alvo',tol,fonte:'Meta do plano (personalizada)'};
 const o=p?patInput(p):null;
 if(pl.kcal>0)M.f={v:14*pl.kcal/1000,tipo:'ref',modo:'min',fonte:'AI da DRI: 14 g por 1.000 kcal'};
 if(o){const dri=driMicro(o.sexo,o.A,o.cond);dri.forEach(d=>{const k=MICMAP[d[0]];if(!k)return;
   if(k==='na'){if(d[2]==='Limite')M.na={v:d[1],tipo:'ref',modo:'max',fonte:'CDRR (NASEM 2019): limite, não meta'}}
   else M[k]={v:d[1],tipo:'ref',modo:'min',fonte:'DRI ('+d[2]+')'}})}
 Object.keys(cu).forEach(k=>{const v=num(cu[k]);if(v>0)M[k]={v,tipo:'meta',modo:['k','c','p','l'].includes(k)?'alvo':(MAXK[k]?'max':'min'),tol,fonte:'Meta definida por você'}});
 return M;
}
/* situação de um nutriente frente à meta/referência */
function situacao(s,m){
 if(!m)return{c:'n',t:'sem referência'};
 if(!s.ok)return{c:'n',t:s.nd?'dados incompletos':'sem dados'};
 const pc=s.v/m.v*100;
 if(m.modo==='alvo'){const d=pc-100;return Math.abs(d)<=m.tol?{c:'y',t:'dentro do alvo',pc}:d<0?{c:'w',t:'▼ abaixo',pc}:{c:'w',t:'▲ acima',pc}}
 if(m.modo==='max')return pc<=100?{c:'y',t:'dentro do limite',pc}:{c:'w',t:'▲ acima do limite',pc};
 return pc>=100?{c:'y',t:'atinge',pc}:{c:'w',t:'▼ abaixo',pc};
}
const fnum=(x,u)=>{if(x===undefined||x===null)return '—';const a=Math.abs(x);return (a>=100?f0(x):a>=10?f1(x):(Math.round(x*100)/100).toLocaleString('pt-BR'))};
S.an=S.an||{vis:'dia',nut:'',cols:['na','ca','fe'],open:false};
function anSet(k,v){S.an[k]=v;render()}
function anMeta(k,v){const pl=S.plan;pl.metas=pl.metas||{};if(v===''||num(v)<=0)delete pl.metas[k];else pl.metas[k]=num(v);render()}
function anTol(v){S.plan.tol=Math.max(1,Math.min(50,num(v)||10));render()}
function anCol(k){const c=S.an.cols,i=c.indexOf(k);if(i>=0)c.splice(i,1);else c.push(k);render()}
/* quem mais contribui para um nutriente no dia */
function contribDia(pl,k){
 const rows=rowsDia(pl),s=somaRows(rows,k),l=rows.filter(r=>r.get(k)!==undefined).map(r=>({nome:r.nome,q:r.q,v:r.get(k)}));
 const agg={};l.forEach(x=>{const a=agg[x.nome]||(agg[x.nome]={nome:x.nome,v:0,q:[]});a.v+=x.v;a.q.push(x.q)});
 const top=Object.values(agg).sort((a,b)=>b.v-a.v);
 return{s,top,semDado:rows.filter(r=>r.get(k)===undefined).map(r=>r.nome)};
}
function anAvisos(pl,p,rows){
 const a=[];
 if(!rows.length)return a;
 if(!p)a.push('Nenhum paciente selecionado: não há referência DRI (sexo/idade). Só valem as metas do plano e as que você definir.');
 else{const o=patInput(p);if(!(o.A>=1))a.push('Menor de 1 ano: este sistema não tem DRI de micronutrientes para essa idade.');if(!o.peso)a.push('Peso do paciente ausente: proteína em g/kg não pode ser avaliada.')}
 const unk=[...new Set(rows.filter(r=>!r.eq&&(['p','c','l'].some(k=>r.get(k)===undefined))).map(r=>r.nome))];
 if(unk.length)a.push('Alimentos com proteína, carboidrato ou lipídio não informados (tratados como desconhecidos, não como zero): '+unk.slice(0,6).map(esc).join(', ')+(unk.length>6?'…':'')+'.');
 const parc=NUT.filter(x=>x.g==='dri'||x.k==='f').filter(x=>{const s=somaRows(rows,x.k);return s.nd>0&&!s.ok});
 if(parc.length)a.push('Dados parciais (valor mostrado é o mínimo conhecido): '+parc.map(x=>x.n).join(', ')+'.');
 const sem=NUT.filter(x=>x.g==='dri').filter(x=>somaRows(rows,x.k).nd===0);
 if(sem.length)a.push('Sem nenhum dado nos alimentos escolhidos: '+sem.map(x=>x.n).join(', ')+'.');
 if(rows.some(r=>r.eq))a.push('Equivalentes entram apenas com energia, macronutrientes e fibra; não têm micronutrientes.');
 const sm=num(pl.pc)+num(pl.pp)+num(pl.pl);if(sm!==100)a.push('Os percentuais de macronutrientes da meta somam '+sm+'%, não 100%.');
 return a;
}

  <td>${m?fnum(m.v):'—'}${m?`<div class="small mut">${m.tipo==='meta'?'<b>meta</b>':'referência'}${m.modo==='max'?' · limite':m.modo==='min'?' · mínimo':''}</div>`:''}</td>

 const sec=(t,l)=>`<tr><th colspan="7" style="background:var(--bg,#f4f4f4)">${t}</th></tr>`+l.map(lin).join('');

  ${c.semDado.length?`<p class="small" style="color:var(--acc)">Sem dado de ${x.n.toLowerCase()} (não contam no total): ${[...new Set(c.semDado)].slice(0,8).map(esc).join(', ')}.</p>`:''}</div>`})():'';
 return `<div style="overflow:auto"><table><tr><th>Nutriente</th><th>Planejado</th><th>Meta / referência</th><th>Diferença</th><th>Adequação</th><th>Situação</th><th>Sua meta</th></tr>
 ${sec('Energia e macronutrientes',NUT.filter(x=>x.g==='mac'))}${sec('Micronutrientes com referência (DRI)',NUT.filter(x=>x.g==='dri'))}</table></div>
 <p class="small mut" style="margin-top:.5rem"><b>Meta</b> = definida por você (plano ou coluna "Sua meta"). <b>Referência</b> = recomendação populacional (DRI) para o sexo, a idade e a condição do paciente; não é prescrição. Alerta de energia e macros: tolerância de <input inputmode="numeric" style="width:50px" value="${pl.tol==null?10:pl.tol}" onchange="anTol(this.value)">% em torno da meta. Toque no nome de um nutriente para ver os alimentos que mais contribuem.</p>${det}`;

function anTabRef(pl,p){

 <h3>Total do dia</h3><div style="overflow:auto"><table><tr>${cols.map(k=>`<th>${nutInfo(k).n}</th>`).join('')}</tr><tr>${cols.map(k=>`<td><b>${tcel(tot,k)}</b> <span class="small mut">${nutInfo(k).u}</span></td>`).join('')}</tr></table></div>

 let st;
 if(S.plan.sem){wkSync();const o=Object.assign({},S.plan);delete o.meals;st=clone(o);st.meals=st.days[0].meals}
 else st=clone(S.plan);

/* ===== LISTA DE COMPRAS (receitas expandidas, sem duplicar, tudo em gramas) ===== */
function cpExpand(foodId,g,fc,acc,depth){
 const f=food(foodId);if(!f||!(g>0))return;
 if(f.rec&&f.rec.ings&&(depth||0)<4){
  const base=num(f.rec.rend)||f.rec.ings.reduce((s,i)=>s+num(i.g),0);
  if(base>0){f.rec.ings.forEach(i=>cpExpand(i.foodId,i.g*g/base,num(i.fc)>=1?num(i.fc):0,acc,(depth||0)+1));return}
 }
 const a=acc[foodId]||(acc[foodId]={liq:0,buy:0,fc:false});a.liq+=g;a.buy+=g*(fc>=1?fc:1);if(fc>=1&&fc!==1)a.fc=true;
}
function cpAgg(meals){const acc={};meals.forEach(m=>m.items.forEach(it=>cpExpand(it.foodId,it.g,0,acc,0)));return acc}
function cpList(){
 const acc=cpAgg(S.cp.plan.meals),by={},k=S.cp.dias;
 Object.keys(acc).forEach(id=>{const f=food(id);if(!f)return;(by[f.gr]=by[f.gr]||[]).push({id,nome:f.nome,g:acc[id].liq*k,buy:acc[id].buy*k,fc:acc[id].fc,ml:densOf(f)?acc[id].liq*k/densOf(f):0})});
 Object.values(by).forEach(a=>a.sort((x,y)=>x.nome.localeCompare(y.nome)));return by;
}
function cpQtd(i){return fmtG(i.fc?i.buy:i.g)+(i.fc?` <span class="small mut">(líquido ${fmtG(i.g)})</span>`:'')+(i.ml?` <span class="small mut">≈ ${f0(i.ml)} mL</span>`:'')}
function openCompras(id){
 const pl=id?S.data.plans.find(x=>x.id===id):S.plan;if(!pl)return;
 if(!id)wkSync();
 const meals=pl.sem?pl.days.reduce((a,d)=>a.concat(d.meals),[]):pl.meals;
 S.cp={plan:{titulo:pl.titulo,meals:clone(meals)},dias:pl.sem?1:7,sem:!!pl.sem,chk:{}};go('compras');
}
function cpTxt(){const by=cpList();return 'Lista de compras ('+S.cp.dias+(S.cp.sem?' semana(s)':' dias')+')\n'+Object.keys(by).sort().map(g=>'\n'+g+'\n'+by[g].map(i=>'☐ '+i.nome+' — '+fmtG(i.fc?i.buy:i.g)).join('\n')).join('\n')+'\n\nPesos como estão no plano (alimentos prontos ou crus, conforme cadastrado). Receitas já aparecem como ingredientes.'}
function vCompras(){
 const c=S.cp;if(!c)return '';const by=cpList(),gs=Object.keys(by).sort(),eqN=c.plan.meals.reduce((s,m)=>s+(m.eq||[]).length,0);
 return `<div class="row sp noprint" style="margin-bottom:1rem"><h1 style="margin:0">Lista de compras</h1><div class="row"><button class="btn ghost sm" onclick="history.length&&go(S.plan&&S.plan.sem?'semana':'planos')">Voltar</button><button class="btn sec sm" onclick="cpCopy()">Copiar</button><a class="btn acc sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(cpTxt())}">WhatsApp</a><button class="btn sm" onclick="window.print()">Imprimir / PDF</button></div></div>
 <div class="card"><b>${esc(c.plan.titulo)}</b><div class="row" style="margin-top:.6rem"><label style="margin:0">${c.sem?'Quantas semanas?':'Quantos dias?'}</label><input inputmode="numeric" style="width:80px" value="${c.dias}" onchange="cpDias(this.value)"></div>
 <p class="small mut" style="margin-top:.5rem">${c.sem?'Soma os 7 dias do plano.':'Soma o que o plano pede por dia vezes os dias.'} Tudo é somado em gramas por alimento (líquidos mostram também o volume), então unidades diferentes nunca se misturam. Receitas entram como os ingredientes delas, sem duplicar. Quando o fator de correção do ingrediente foi informado, aparece a quantidade a comprar (bruta).</p>
 ${eqN?`<p class="small" style="color:var(--acc)">${eqN} item(ns) por equivalentes não entram na lista: o paciente escolhe o alimento.</p>`:''}</div>
 ${gs.length?gs.map(g=>`<div class="card"><h3>${esc(g)}</h3>${by[g].map(i=>`<div class="item pill" onclick="cpChk('${i.id}')"><span style="${c.chk[i.id]?'text-decoration:line-through;opacity:.5':''}">${c.chk[i.id]?'☑':'☐'} ${esc(i.nome)}</span><b>${cpQtd(i)}</b></div>`).join('')}</div>`).join(''):'<div class="card mut">Esse plano ainda não tem alimentos.</div>'}`;
}

/* ===== 2.3 RECEITAS E RENDIMENTO ===== */
function rcTot(r){const t={k:0,p:0,c:0,l:0,f:0,g:0,bruto:0,nv:1};r.ings.forEach(i=>{const f=food(i.foodId);if(!f)return;const x=i.g/100;t.k+=f.k*x;t.p+=f.p*x;t.c+=f.c*x;t.l+=f.l*x;t.f+=(f.f||0)*x;t.g+=i.g;t.bruto+=i.g*(num(i.fc)>=1?num(i.fc):1);t.nv=Math.max(t.nv,f.nova||1)});return t}
function rcPorc(r,rend){ /* peso e número de porções, a partir do que foi informado */
 const pg=num(r.pg),np=num(r.np);let pgE=0,npE=0,de='';
 if(pg>0){pgE=pg;npE=rend>0?rend/pg:0;de='peso da porção informado'}
 else if(np>0&&rend>0){npE=np;pgE=rend/np;de='número de porções informado'}
 return{pg:pgE,np:npE,de};
}
function openRec(id){
 const f=id&&S.data.foods.find(x=>x.id===id);
 S.rc=f&&f.rec?{id:f.id,nome:f.nome,ings:clone(f.rec.ings),rend:f.rec.rend||'',pn:f.rec.pn||'porção',pg:f.rec.pg||'',np:f.rec.np||'',modo:f.rec.modo||''}:{id:'',nome:'',ings:[],rend:'',pn:'porção',pg:'',np:'',modo:''};
 go('receita');
}
function rcFc(i,v){const x=num(v);S.rc.ings[i].fc=x>=1?x:'';render()}
function rcBuild(prev){
 const r=S.rc,t=rcTot(r);
 if(!r.nome.trim()&&!prev)return{er:'Dê um nome à receita.'};
 if(!r.ings.length||!t.g)return{er:'Adicione ao menos um ingrediente.'};
 if(r.ings.some(i=>!food(i.foodId)))return{er:'Há ingrediente removido do banco: troque ou exclua.'};
 const rend=num(r.rend)||t.g,k=100/rend,po=rcPorc(r,rend),pg=po.pg;
 const f={id:r.id||'c'+uid(),nome:r.nome.trim()||'(sem nome)',gr:'Preparações',nova:t.nv,k:+(t.k*k).toFixed(1),p:+(t.p*k).toFixed(1),c:+(t.c*k).toFixed(1),l:+(t.l*k).toFixed(1),f:+(t.f*k).toFixed(1),med:pg?[[(r.pn||'porção').trim(),+pg.toFixed(1)]]:[],rec:{ings:r.ings.map(i=>({foodId:i.foodId,g:i.g,fc:num(i.fc)>=1?num(i.fc):''})),rend:num(r.rend)||'',pn:r.pn,pg:num(r.pg)||'',np:num(r.np)||''},fonte:'rec',prep:'Preparação caseira',ref:'100 g',upd:today(),m:rcMic(r,rend)};
 if(!r.ings.every(i=>{const x=food(i.foodId);return x&&x.f!==undefined}))f.f=undefined;
 ['p','c','l'].forEach(q=>{if(r.ings.some(i=>{const x=food(i.foodId);return x&&(x.unk||[]).includes(q)}))f[q]=undefined});
 return{f};
}
function saveRec(silent){
 const b=rcBuild();if(b.er){toast(b.er);return null}
 const f=b.f,i=S.data.foods.findIndex(x=>x.id===f.id);if(i>=0)S.data.foods[i]=f;else S.data.foods.push(f);
 S.rc.id=f.id;save();if(silent!==true){toast('Receita salva em Alimentos.');go('alimentos')}return f;
}
function rcToPlan(){
 const f=saveRec(true);if(!f)return;
 const mi=+document.getElementById('rcmeal').value||0,n=num(document.getElementById('rcn').value)||1,pg=f.med&&f.med[0]?f.med[0][1]:0;
 if(!S.plan)openPlan();
 if(!S.plan.meals[mi])return toast('Escolha uma refeição.');
 const it=pg?{foodId:f.id,g:Math.round(pg*n*100)/100,q:n,u:f.med[0][0]}:{foodId:f.id,g:100*n,q:100*n,u:'g'};
 S.plan.meals[mi].items.push(it);toast('Receita adicionada ao plano');go('plano');
}
function vReceita(){
 const r=S.rc;if(!r)return '';
 const t=rcTot(r),rend=num(r.rend)||t.g,k=rend?100/rend:0,po=rcPorc(r,rend),b=rcBuild(true),f=b.f;
 const per=x=>f1(x*k),porc=x=>po.pg?f1(x*po.pg/rend):'—';
 const fr=num(r.rend)&&t.g?num(r.rend)/t.g:0;
 const av=[];
 if(!num(r.rend))av.push('Peso final pronto não informado: os valores por 100 g usam a soma dos ingredientes, sem considerar perda ou ganho de água no preparo. Pese a receita pronta para melhorar a precisão.');
 if(r.ings.some(i=>{const x=food(i.foodId);return x&&x.f===undefined}))av.push('Algum ingrediente não tem fibra informada: a fibra da receita fica como não informada.');
 if(r.ings.length&&!num(r.rend)===false&&(fr>3||fr<0.3))av.push('Rendimento fora do comum ('+String(fr.toFixed(2)).replace('.',',')+'×). Confira os pesos.');
 av.push('Não há fator de retenção: vitaminas sensíveis ao calor podem estar superestimadas depois do cozimento.');
 if(r.ings.some(i=>{const x=food(i.foodId);return x&&!x.rec&&/Cru/.test(x.prep||'')})&&num(r.rend))av.push('Ingredientes crus + peso final cozido: o rendimento (peso pronto ÷ peso dos ingredientes) já embute a água absorvida ou perdida.');
 return `<div class="row sp" style="margin-bottom:1rem"><h1 style="margin:0">${r.id?'Editar receita':'Nova receita'}</h1><div class="row"><button class="btn ghost sm" onclick="go('alimentos')">Cancelar</button><button class="btn" onclick="saveRec()">Salvar receita</button></div></div>
 <p class="small mut">Monte a preparação com alimentos cadastrados. A receita vira um alimento seu (por 100 g do prato pronto) e pode entrar direto no plano, em porções. Os pesos dos ingredientes são o <b>comestível (líquido)</b>; informe o fator de correção (FC) só se quiser que a lista de compras mostre a quantidade bruta.</p>

 <div><label>Nome da porção</label><input value="${esc(r.pn)}" onchange="rcSet('pn',this.value)" placeholder="ex: porção, fatia, prato"></div>
 <div><label>Peso de 1 porção (g) <span class="small mut">ou informe o nº de porções</span></label><input inputmode="decimal" value="${esc(r.pg)}" onchange="rcSet('pg',this.value);render()"></div>
 <div><label>Número de porções (rendimento)</label><input inputmode="decimal" value="${esc(r.np)}" onchange="rcSet('np',this.value);render()"></div></div></div>
 <div class="card"><h2>Ingredientes</h2>${r.ings.length?r.ings.map((i,n)=>{const x=food(i.foodId);return `<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:150px"><b>${x?esc(x.nome):'(removido)'}</b><div class="small mut">${x?esc(x.prep||'')+' · '+f0(x.k*i.g/100)+' kcal':''}</div></div><input inputmode="decimal" style="width:84px" value="${String(i.g).replace('.',',')}" onchange="rcG(${n},this.value)"><span class="small mut">g</span><input inputmode="decimal" style="width:64px" placeholder="FC" title="Fator de correção (peso bruto ÷ peso líquido), opcional" value="${i.fc?String(i.fc).replace('.',','):''}" onchange="rcFc(${n},this.value)"><button class="btn sm red" onclick="rcDel(${n})">×</button></div>`}).join(''):'<p class="mut small">Nenhum ingrediente ainda.</p>'}
 <label style="margin-top:.8rem">Buscar ingrediente</label><input placeholder="Digite 2 letras ou mais..." oninput="rcFind(this.value)"><div id="rcres" style="margin-top:.4rem"></div></div>
 <div class="card"><h2>Pesos e rendimento</h2>${t.g?`<div class="chips"><div class="chip"><b>${f0(t.g)} g</b><span class="small mut">ingredientes (líquido)</span></div>${t.bruto>t.g+0.01?`<div class="chip"><b>${f0(t.bruto)} g</b><span class="small mut">ingredientes (bruto, com FC)</span></div>`:''}<div class="chip"><b>${num(r.rend)?f0(num(r.rend))+' g':'—'}</b><span class="small mut">peso final pronto</span></div><div class="chip"><b>${fr?String(fr.toFixed(2)).replace('.',','):'—'}×</b><span class="small mut">fator de rendimento</span></div>${po.pg?`<div class="chip"><b>${f1(po.np)}</b><span class="small mut">porções de ${f0(po.pg)} g</span></div>`:''}</div>
 <div style="margin-top:.6rem">${av.map(x=>`<div class="small mut">⚠ ${x}</div>`).join('')}</div>`:'<p class="mut small">Adicione ingredientes.</p>'}</div>
 <div class="card"><h2>Composição</h2>${t.g?`<div style="overflow:auto"><table><tr><th></th><th>Receita toda</th><th>100 g pronto</th>${po.pg?`<th>1 ${esc(r.pn||'porção')} (${f0(po.pg)} g)</th>`:''}</tr>
 ${[['Energia (kcal)','k'],['Carboidrato (g)','c'],['Proteína (g)','p'],['Lipídio (g)','l'],['Fibra (g)','f']].map(([n,q])=>{const u=!f||f[q]===undefined;return `<tr><td>${n}</td><td>${u?'n/d':f1(t[q])}</td><td>${u?'n/d':per(t[q])}</td>${po.pg?`<td>${u?'n/d':porc(t[q])}</td>`:''}</tr>`}).join('')}

/* ===== 2.4 SUBSTITUIÇÕES COM EQUIVALÊNCIA REAL ===== */
const SUBCL={'Cereais e massas':'c','Tubérculos':'c','Frutas':'c','Açúcares e doces':'c','Leguminosas':'k','Carnes':'p','Peixes':'p','Ovos':'p','Leite e derivados':'p','Óleos e gorduras':'l','Oleaginosas':'l','Verduras':'k','Legumes':'k','Bebidas':'k'};
const subMain=f=>SUBCL[f.gr]||'k';
const SUBNOM={k:'energia',c:'carboidrato',p:'proteína',l:'lipídio'};
const prepCls=p=>p==='Cru'?'cru':['Cozido','Grelhado','Assado','Refogado'].includes(p)?'cozido':p;
const gRound=x=>x>=25?Math.round(x/5)*5:Math.max(1,Math.round(x));
const mval=(f,m)=>m==='k'?f.k:f[m];
function subQty(f,g,x,by){const m=by&&by!=='auto'?by:subMain(f),a=mval(f,m),b=mval(x,m);return b>0&&a>0?gRound(g*a/b):gRound(g*f.k/x.k)}
function subKnown(f){return f&&f.k>0&&!['p','c','l'].some(k=>unkOf(f,k)||typeof f[k]!=='number'||isNaN(f[k]))}
function subDiff(f,g,x,g2){const d=k=>(x[k]||0)*g2/100-(f[k]||0)*g/100;return{k:d('k'),p:d('p'),c:d('c'),l:d('l'),f:(f.f!==undefined&&x.f!==undefined)?x.f*g2/100-f.f*g/100:undefined}}
function subCands(f,g,by){
 by=by||'auto';const main=by==='auto'?subMain(f):by;
 if(!subKnown(f))return{list:[],motivo:'O alimento original não tem energia, proteína, carboidrato e lipídio informados; sem isso não dá para provar equivalência.'};
 if(!(mval(f,main)>0))return{list:[],motivo:'O alimento original tem '+SUBNOM[main]+' igual a zero ou desconhecido, então ele não serve como base de equivalência. Escolha outro critério.'};
 const k0=f.k*g/100,list=[];let semDado=0;
 allFoods().forEach(x=>{
  if(x.id===f.id||FAM[x.gr]!==FAM[f.gr]||chaveFood(x)===chaveFood(f))return;
  if(!subKnown(x)){semDado++;return}
  if(!x.prep||x.prep==='Não informado'||!f.prep||f.prep==='Não informado'||prepCls(x.prep)!==prepCls(f.prep))return;
  if(x.nova&&f.nova&&x.nova>Math.max(f.nova,3))return;
  if(!(mval(x,main)>0))return;
  const g2=subQty(f,g,x,by),r=g2/g;if(r<1/3||r>3)return;
  const d=subDiff(f,g,x,g2);
  if(by==='auto'||by!=='k'){if(Math.abs(d.k)>0.15*k0)return}
  let sc=Math.abs(d.k)/(k0||1),ok=true;
  for(const q of['c','p','l']){if(q===main)continue;const o=f[q]*g/100;if(Math.abs(d[q])>Math.max(3,0.3*o)){ok=false;break}sc+=Math.abs(d[q])/Math.max(3,o)}
  if(!ok)return;
  list.push({f:x,g:g2,d,sc,main});
 });
 list.sort((a,b)=>a.sc-b.sc);
 return{list,motivo:list.length?'':'Nenhum alimento do mesmo grupo passou nos critérios (mesmo preparo, energia dentro de 15% e macronutrientes próximos'+(semDado?'; '+semDado+' candidatos ficaram de fora por falta de dados':'')+').'};
}
function autoSubs(f){return f?subCands(f,100).list.slice(0,4).map(c=>c.f.id):[]}

 const f=food(it.foodId);if(!f)return[];
 return(it.subs||[]).map(e=>typeof e==='string'?{id:e,st:'ok'}:e).map(e=>{const x=food(e.id);return x?{f:x,id:e.id,st:e.st,g:e.st==='edit'&&e.g>0?e.g:subQty(f,it.g,x)}:null}).filter(Boolean);
}
const subEnt=(it,id)=>{it.subs=it.subs||[];let i=it.subs.findIndex(e=>(typeof e==='string'?e:e.id)===id);if(i<0){it.subs.push({id,st:'ok'});i=it.subs.length-1}else if(typeof it.subs[i]==='string')it.subs[i]={id,st:'ok'};return it.subs[i]};

 const lista=r.list.filter(c=>!(it.subRej||[]).includes(c.f.id));

 return `<div class="modal"><div class="mbox full"><div class="row sp"><h2 style="margin:0">${k.opts?'Opções de substituição':'Trocar alimento'}</h2><button class="btn sm ghost" onclick="S.sub=null;render()">${k.opts?'Pronto':'Fechar'}</button></div>

 <div class="chips2">${[['auto','Automático'],['k','Energia'],['c','Carboidrato'],['p','Proteína'],['l','Lipídio']].map(([b,n])=>`<span class="chip2 ${(k.by||'auto')===b?'on':''}" onclick="S.sub.by='${b}';S.sub.manual=1;render()">${n}</span>`).join('')}</div>

}

/* ---- 3.2 QUESTIONÁRIO PRÉ-CONSULTA ----
   p.qDraft = {resp:{id:valor}, upd, base}  (rascunho salvo a cada resposta)
   p.qCust  = [{id,q,t}]                    (perguntas personalizadas do paciente)
   p.quests = [{id,data,upd,resp,cust,origem,schema}]  (histórico de respostas concluídas) */
const QSEC=[
 ['Objetivos',[['obj1','Qual é o seu principal objetivo com o acompanhamento?','area','queixa'],['obj2','Há uma meta (peso, medida, exame) ou prazo em mente?','txt'],['obj3','O que já tentou antes e como foi?','area']]],
 ['Rotina e horários',[['acorda','Horário em que costuma acordar','time'],['dorme','Horário em que costuma dormir','time'],['trab','Trabalho ou estudo: turno e local','txt'],['refn','Quantas refeições faz por dia?','num'],['horref','Horários e locais das refeições','area','rotina'],['cozinha','Quem cozinha e quem compra os alimentos?','txt','socio'],['fora','Quantas vezes por semana come fora de casa?','num']]],
 ['Hábitos alimentares',[['agua','Quantos litros de água bebe por dia?','num','agua'],['belisca','Costuma beliscar entre as refeições? Quando?','area'],['pressa','Come com pressa ou usando telas?','sn'],['alcool','Consumo de bebida alcoólica e tabagismo','txt','habitos'],['fome','Em que momentos sente mais fome ou vontade de comer?','area']]],
 ['Preferências',[['gosta','Alimentos e preparações de que mais gosta','area','gosta'],['sabor','Sabores e texturas preferidos','txt']]],
 ['Aversões',[['naogosta','Alimentos que não come ou de que não gosta','area','naogosta']]],
 ['Restrições',[['alerg','Alergias e intolerâncias alimentares','area','alerg'],['relig','Restrições culturais, religiosas ou escolhas (ex.: vegetariano)','txt'],['meds','Medicamentos e suplementos em uso','area','meds']]],
 ['Atividade física, sono e intestino',[['ativ','Atividade física (tipo, frequência, horário)','area','ativ'],['sono','Horas de sono e qualidade','txt','sono'],['intest','Funcionamento intestinal','txt','intest']]],
 ['Expectativas',[['exp1','O que espera da consulta?','area'],['exp2','Que dificuldades prevê para seguir um plano?','area']]]
];
const QALL=()=>QSEC.reduce((a,s)=>a.concat(s[1]),[]);
S.qv=S.qv||'';
const qResp=(p)=>((p.qDraft||{}).resp)||{};
const qFilled=(r,v)=>v!==undefined&&v!==null&&String(v).trim()!=='';
function qCount(p,resp){resp=resp||qResp(p);const all=QALL().map(q=>q[0]).concat((p.qCust||[]).map(c=>c.id));return{n:all.filter(id=>qFilled(0,resp[id])).length,t:all.length}}
function qSet(pid,id,v){const p=pat(pid);p.qDraft=p.qDraft||{resp:{},base:''};p.qDraft.resp[id]=v;p.qDraft.upd=new Date().toISOString();save();const e=document.getElementById('qprog');if(e){const c=qCount(p);e.textContent=c.n+' de '+c.t+' respondidas · rascunho salvo'}}
function qUltima(p){return[...(p.quests||[])].sort((a,b)=>b.upd.localeCompare(a.upd))[0]}
/* reaproveitamento: o que já existe na anamnese ou numa resposta anterior */
function qHint(p,q){
 const id=q[0],cur=qResp(p)[id];if(qFilled(0,cur))return null;
 const ul=qUltima(p);if(ul&&qFilled(0,ul.resp[id]))return{v:ul.resp[id],de:'questionário de '+fdate(ul.data)};
 if(q[3]&&p.anam&&qFilled(0,p.anam[q[3]]))return{v:p.anam[q[3]],de:'anamnese'};
 return null;
}
function qUsar(pid,id){const p=pat(pid),q=QALL().find(x=>x[0]===id),h=qHint(p,q);if(!h)return;qSet(pid,id,h.v);render()}
function qUsarTodas(pid){const p=pat(pid);let n=0;QALL().forEach(q=>{const h=qHint(p,q);if(h){qSet(pid,q[0],h.v);n++}});toast(n?n+' respostas reaproveitadas. Revise o que mudou.':'Nada para reaproveitar.');render()}
function qInput(p,q){
 const id=q[0],v=qResp(p)[id]??'',t=q[2],h=qHint(p,q);
 let inp;
 if(t==='area')inp=`<textarea style="min-height:64px" onchange="qSet('${p.id}','${id}',this.value)">${esc(v)}</textarea>`;
 else if(t==='sn')inp=`<select onchange="qSet('${p.id}','${id}',this.value)"><option value="">—</option>${['Sim','Não','Às vezes'].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
 else inp=`<input ${t==='time'?'type="time"':t==='num'?'inputmode="decimal"':''} value="${esc(v)}" onchange="qSet('${p.id}','${id}',this.value)">`;
 return `<div><label>${esc(q[1])}</label>${inp}${h?`<div class="small mut">Já informado (${h.de}): “${esc(String(h.v).slice(0,90))}” <span class="lk" style="cursor:pointer;text-decoration:underline" onclick="qUsar('${p.id}','${id}')">usar</span></div>`:''}</div>`;
}

function qDel(pid,id){if(!confirm('Apagar este registro do histórico?'))return;const p=pat(pid);p.quests=p.quests.filter(x=>x.id!==id);if(S.qv===id)S.qv='';save();render()}
function qVer(id){S.qv=S.qv===id?'':id;render()}
function qParaAnam(pid,id){

 QALL().forEach(q=>{if(q[3]&&qFilled(0,x.resp[q[0]])&&!qFilled(0,p.anam[q[3]])){p.anam[q[3]]=x.resp[q[0]];n++}});

function qCopiar(pid){const t=qTexto(pat(pid));if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Perguntas copiadas'),()=>toast('Não consegui copiar'));else toast('Copiar não é suportado aqui.')}
function qLeitura(p,x){
 const sec=QSEC.map(s=>({n:s[0],l:s[1].filter(q=>qFilled(0,x.resp[q[0]]))})).filter(s=>s.l.length),cu=(x.cust||[]).filter(c=>qFilled(0,x.resp[c.id]));

function tQuest(p){
 const c=qCount(p),h=(p.quests||[]).length?[...p.quests].sort((a,b)=>b.upd.localeCompare(a.upd)):[],ul=h[0];
 return `<div class="card noprint"><div class="row sp"><div><h2 style="margin:0">Questionário pré-consulta</h2><div class="small mut">As respostas são salvas sozinhas (rascunho). Nada é obrigatório.</div></div><div class="row"><button class="btn sm ghost" onclick="qCopiar('${p.id}')">Copiar perguntas</button><button class="btn sm ghost" onclick="window.print()">Imprimir em branco</button></div></div>
 <p class="small" style="margin-top:.5rem"><b id="qprog">${c.n} de ${c.t} respondidas</b>${p.qDraft&&p.qDraft.upd?' · rascunho de '+fdt(p.qDraft.upd):''}${ul?` · último registrado em ${fdate(ul.data)}`:''}</p>

 ${QSEC.map(s=>`<div class="card noprint"><h3>${s[0]}</h3><div class="grid g2">${s[1].map(q=>qInput(p,q)).join('')}</div></div>`).join('')}
