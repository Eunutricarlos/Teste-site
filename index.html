<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nome do sistema</title>
<style>
:root{--bg:#f4f4f4;--ink:#1f2a33;--mut:#66727c;--brand:#1b4f72;--brand-d:#143a55;--brand-l:#e1ebf2;--acc:#d75413;--acc-l:#fbe9e0;--card:#fff;--bd:#dcdfe2;--red:#c0392b;--ok:#1e8449;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h1{font-size:1.5rem}h2{font-size:1.1rem;color:var(--brand)}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--bd);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:.25rem;font-weight:600}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.acc{background:var(--acc)}
.btn.sec{background:var(--brand-l);color:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--bd)}
.btn.red{background:#fdecea;color:var(--red)}
.btn.sm{padding:.35rem .65rem;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:.85rem}
.tag{display:inline-block;background:var(--acc-l);color:var(--acc);padding:.1rem .55rem;border-radius:99px;font-size:.78rem;font-weight:700}
.stat b{display:block;font-size:1.8rem;color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--bd);font-size:.9rem}
th{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.pill{cursor:pointer}
details{border:1px solid var(--bd);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0;background:#fafafa}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
.shell{display:flex;min-height:100vh}
aside{width:240px;background:var(--brand);color:#dbe7ef;padding:1rem .8rem;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;color:#fff;padding:.3rem .5rem 1rem;font-size:1.05rem}
.logo svg{width:28px;height:28px;stroke:#fff}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .7rem;border-radius:10px;color:#dbe7ef;cursor:pointer;margin-bottom:2px}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--acc);color:#fff}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;background:#fff;border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:5}
.burger{display:none;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--brand)}
main{padding:1.2rem;max-width:1100px;margin:0 auto}
.scrim{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--brand-d),var(--brand) 65%,var(--acc) 160%)}
.auth .box{background:#fff;border-radius:20px;padding:1.5rem;width:100%;max-width:460px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:1rem}
.tabs button{flex:1;border:0;background:none;padding:.55rem;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin:.5rem 0}
.bar{height:8px;background:#e6e8ea;border-radius:9px;overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--acc)}
.meal{border:1px solid var(--bd);border-radius:12px;padding:.8rem;margin-bottom:.8rem;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand-d);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ck{display:flex;gap:.5rem;padding:.35rem 0;font-size:.9rem}
.ck b{width:1.2rem;text-align:center}.ck .y{color:var(--ok)}.ck .w{color:var(--acc)}.ck .n{color:var(--mut)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-size:.8rem;cursor:pointer;font-weight:600}
.pwm{font-size:.78rem;margin-top:.2rem}
.printonly{display:none}
@media(max-width:820px){
 aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.2s}
 .shell.open aside{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
 .burger{display:block}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .g4.keep{grid-template-columns:repeat(2,1fr)}
 main{padding:.9rem}
}
@media print{
 aside,.top,.noprint,.scrim,.toast,.screenonly{display:none!important}
 .printonly{display:block!important}
 body{background:#fff}main{padding:0;max-width:none}
 .pr h1{font-size:1.3rem}.pr table th,.pr table td{border:1px solid #999}
}
</style>
</head>

 try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),'PBKDF2',false,['deriveBits']);

 catch(e){let h=5381;for(const c of salt+s)h=((h<<5)+h+c.charCodeAt(0))|0;return'f'+h}

 {id:'owen',n:'Owen (1986/1987)',f:o=>o.A<18?null:o.sexo==='M'?879+10.2*o.peso:795+7.18*o.peso},
 {id:'cun80',n:'Cunningham (1980) – usa massa livre de gordura',need:'mlg',f:o=>o.mlg?500+22*o.mlg:null},
 {id:'katch',n:'Katch-McArdle / Cunningham (1991) – usa MLG',need:'mlg',f:o=>o.mlg?370+21.6*o.mlg:null}
];
/* EER – DRI/IOM 2005 */
function eer(o){
 const m=Math.round(o.idade*12),P=o.peso,H=o.H,A=o.A,M=o.sexo==='M',pa=PAI[o.af]??1;let v;
 if(m<36){v=89*P-100+(m<=3?175:m<=6?56:m<=12?22:20)}
 else if(A<19){const d=A<9?20:25;v=M?88.5-61.9*A+[1,1.13,1.26,1.42][pa]*(26.7*P+903*H)+d:135.3-30.8*A+[1,1.16,1.31,1.56][pa]*(10*P+934*H)+d}
 else if(P/(H*H)>=25){v=M?1086-10.1*A+[1,1.12,1.29,1.59][pa]*(13.7*P+416*H):448-7.95*A+[1,1.16,1.27,1.44][pa]*(11.4*P+619*H)}
 else{v=M?662-9.53*A+[1,1.11,1.25,1.48][pa]*(15.91*P+539.6*H):354-6.91*A+[1,1.12,1.27,1.45][pa]*(9.36*P+726*H)}
 return v+(o.sexo==='F'&&A>=10?CADD[o.cond]||0:0);
}
function energyList(o){
 if(!o.peso||!o.altura||!o.idade)return[];
 const add=o.sexo==='F'&&o.A>=10?CADD[o.cond]||0:0,out=[];
 TMBM.forEach(m=>{const t=m.f(o);const fa=m.fao?FAOF[o.sexo][FAOI[o.af]]:HBF[o.af];out.push({id:m.id,n:m.n,t,g:t==null?null:t*fa+add,fa,need:m.need})});
 out.push({id:'eer',n:'EER – DRI/IOM (2005): já inclui atividade',t:null,g:eer(o)});
 return out;
}

/* ===== DRI: AMDR, RDA, água ===== */
function amdr(A,m){
 if(m<12)return null;
 if(A<4)return{c:[45,65],p:[5,20],l:[30,40]};
 if(A<19)return{c:[45,65],p:[10,30],l:[25,35]};
 return{c:[45,65],p:[10,35],l:[20,35]};
}
function protRDA(A,m,cond){
 if(m<6)return 1.52;if(m<12)return 1.2;
 if(A>=14&&A<=50&&cond&&cond!=='none'){return cond[0]==='g'?1.1:1.3}
 return A<4?1.05:A<14?0.95:A<19?0.85:0.8;
}
function chorda(A,m,cond){if(m<12)return 0;if(cond&&cond[0]==='g')return 175;if(cond&&cond[0]==='l')return 210;return 130}
function aguaAI(A,m,sexo,cond){
 if(m<6)return 0.7;if(m<12)return 0.8;
 if(A>=14&&cond&&cond[0]==='g')return 3.0;if(A>=14&&cond&&cond[0]==='l')return 3.8;
 if(A<4)return 1.3;if(A<9)return 1.7;if(A<14)return sexo==='M'?2.4:2.1;if(A<19)return sexo==='M'?3.3:2.3;
 return sexo==='M'?3.7:2.7;
}

const MIC=[

 ['Potássio (mg)',{M:[2000,2300,2500,3000,3400,3400,3400,3400],F:[2000,2300,2300,2300,2600,2600,2600,2600]},{3:2600,4:2900,5:2900},{3:2500,4:2800,5:2800},'AI'],

];
function driMicro(sexo,A,cond){
 const g=grp(A);if(g<0)return[];
 const gl=cond&&cond[0]==='g'?2:cond&&cond[0]==='l'?3:0;
 return MIC.map(r=>{let v=r[1][sexo][g];if(gl&&sexo==='F'&&r[gl]&&r[gl][g]!=null)v=r[gl][g];return[r[0],v,r[4]]});

function pwMeter(el){
 const s=el.value;let n=0;if(s.length>=8)n++;if(s.length>=12)n++;if(/[a-z]/.test(s)&&/[A-Z]/.test(s))n++;if(/\d/.test(s))n++;if(/[^A-Za-z0-9]/.test(s))n++;

}
const pwField=(name,lbl,auto,meter)=>`<div style="margin-bottom:.7rem"><label>${lbl}</label><div class="pw"><input name="${name}" type="password" required autocomplete="${auto}" ${meter?'oninput="pwMeter(this)"':''}><button type="button" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'">mostrar</button></div>${meter?'<div class="pwm" id="pwm"></div>':''}</div>`;

 else if(t==='reg')body=`<form onsubmit="doRegister(event)">

 else if(!S.fg)body=`<form onsubmit="fgStep1(event)"><p class="small mut">Informe o e-mail da conta para ver sua pergunta de segurança.</p><div style="margin-bottom:.7rem"><label>E-mail</label><input name="email" type="email" required></div><div class="err" id="authmsg"></div><button class="btn" style="width:100%;justify-content:center">Continuar</button><p class="small" style="text-align:center;margin:.8rem 0 0"><a href="#" style="color:var(--acc)" onclick="S.authTab='login';render();return false">Voltar</a></p></form>`;
 else body=`<form onsubmit="fgStep2(event)"><p><b>${esc(S.fg.q)}</b></p><div style="margin-bottom:.7rem"><input name="resp" required placeholder="Sua resposta"></div>${pwField('senha','Nova senha','new-password',1)}${pwField('senha2','Confirmar nova senha','new-password')}<div class="err" id="authmsg"></div><button class="btn" style="width:100%;justify-content:center">Redefinir senha</button></form>`;
 return `<div class="auth"><div class="box">${logo}${t==='forgot'?'<h2>Recuperar senha</h2>':tabs}${body}<p class="small mut" style="margin:1rem 0 0">Os dados ficam salvos somente neste navegador/aparelho.</p></div></div>`;

function perfilChange(v){document.getElementById('ex-est').style.display=v==='est'?'block':'none';document.getElementById('ex-nut').style.display=v==='nut'?'block':'none'}

const lockLeft=em=>{const f=LS.get('nd_fail',{})[em];return f&&f.n>=5&&Date.now()-f.t<60000?Math.ceil((60000-(Date.now()-f.t))/1000):0};
function failAdd(em){const a=LS.get('nd_fail',{}),f=a[em]||{n:0,t:0};if(f.n>=5&&Date.now()-f.t>=60000)f.n=0;f.n++;f.t=Date.now();a[em]=f;LS.set('nd_fail',a)}
function failClr(em){const a=LS.get('nd_fail',{});delete a[em];LS.set('nd_fail',a)}
async function doRegister(e){
 e.preventDefault();const f=e.target.elements,v=k=>(f[k]?f[k].value.trim():'');
 const users=LS.get('nd_users',[]),email=v('email').toLowerCase();
 if(users.some(u=>u.email===email))return amsg('Esse e-mail já tem cadastro.');
 if(!pwOk(f.senha.value))return amsg('A senha precisa de 8+ caracteres, com letras e números.');
 if(f.senha.value!==f.senha2.value)return amsg('As senhas não conferem.');
 const salt=uid(),u={id:uid(),nome:v('nome'),email,salt,hash:await hash(f.senha.value,salt),qi:+f.qi.value,ah:await hash(nz(f.resp.value),salt),perfil:v('perfil'),inst:v('inst'),periodo:v('periodo'),orient:v('orient'),crn:v('crn'),criado:new Date().toISOString()};
 users.push(u);LS.set('nd_users',users);LS.set('nd_session',u.id);S.user=u;S.data=emptyData();save();S.view='dash';render();
}
async function doLogin(e){
 e.preventDefault();const f=e.target.elements,em=f.email.value.trim().toLowerCase(),L=lockLeft(em);
 if(L)return amsg(`Muitas tentativas. Aguarde ${L}s.`);
 const u=LS.get('nd_users',[]).find(u=>u.email===em);
 if(!u||u.hash!==await hash(f.senha.value,u.salt)){failAdd(em);return amsg('E-mail ou senha incorretos.')}
 failClr(em);LS.set('nd_session',u.id);S.user=u;S.data=Object.assign(emptyData(),LS.get('nd_data_'+u.id,{}));S.view='dash';render();
}
function fgStep1(e){e.preventDefault();const em=e.target.elements.email.value.trim().toLowerCase(),u=LS.get('nd_users',[]).find(u=>u.email===em);if(!u||u.qi==null)return amsg('Conta não encontrada.');S.fg={email:em,q:QS[u.qi]};render()}
async function fgStep2(e){
 e.preventDefault();const f=e.target.elements,L=lockLeft(S.fg.email);if(L)return amsg(`Aguarde ${L}s.`);
 const users=LS.get('nd_users',[]),u=users.find(x=>x.email===S.fg.email);
 if(u.ah!==await hash(nz(f.resp.value),u.salt)){failAdd(S.fg.email);return amsg('Resposta incorreta.')}
 if(!pwOk(f.senha.value))return amsg('A senha precisa de 8+ caracteres, com letras e números.');
 if(f.senha.value!==f.senha2.value)return amsg('As senhas não conferem.');
 u.salt=uid();u.hash=await hash(f.senha.value,u.salt);u.ah=await hash(nz(f.resp.value),u.salt);LS.set('nd_users',users);failClr(u.email);
 S.fg=null;S.authTab='login';render();toast('Senha redefinida. Faça login.');

 if(R){for(const[n,v,r]of[['Carboidrato',pc,R.c],['Proteína',pp,R.p],['Lipídio',pl2,R.l]])out.push([v>=r[0]&&v<=r[1]?'y':'w',`${n}: ${f1(v)}% das kcal (AMDR/DRI: ${r[0]}–${r[1]}%)`])}

 const pi=[['Faixa de IMC eutrófico (18,5–24,9)',f1(18.5*o.H*o.H)+' a '+f1(24.9*o.H*o.H)+' kg'],['Devine (1974)',f1(M?50+2.3*ex:45.5+2.3*ex)+' kg'],['Hamwi (1964)',f1(M?48+2.7*ex:45.5+2.3*ex)+' kg'],['Lorentz (1929)',f1(M?H-100-(H-150)/4:H-100-(H-150)/2)+' kg'],['Robinson (1983)',f1(M?52+1.9*ex:49+1.7*ex)+' kg'],['Miller (1983)',f1(M?56.2+1.41*ex:53.1+1.36*ex)+' kg']];
 const pi22=22*o.H*o.H,paj=pi22+0.25*(o.peso-pi22);
 const cin=d('cintura'),qua=d('quadril');
 const rc=!cin?'':(M?(cin>=102?'risco muito aumentado':cin>=94?'risco aumentado':'sem risco'):(cin>=88?'risco muito aumentado':cin>=80?'risco aumentado':'sem risco'));
 h+=`<div class="card"><h2>Antropometria</h2><p><b>IMC: ${f1(v)} kg/m²</b> – ${imcCls(v,o.A)}</p>
  ${o.A<19?'<p class="small mut">Para menores de 19 anos a classificação correta usa o escore-z de IMC/idade (curvas da OMS, adotadas pelo SISVAN). Não incluí as tabelas.</p>':''}
  ${cin?`<p>Circunferência da cintura: ${f1(cin)} cm – ${rc} (OMS)</p>`:''}${cin&&qua?`<p>Relação cintura/quadril: ${(cin/qua).toFixed(2)} – ${cin/qua>(M?0.90:0.85)?'acima do ponto de corte da OMS':'dentro do esperado'} (corte: ${M?'0,90':'0,85'})</p>`:''}
  ${cin?`<p>Relação cintura/estatura: ${(cin/o.altura).toFixed(2)} – ${cin/o.altura>=0.5?'risco aumentado (≥ 0,5)':'dentro do esperado'}</p>`:''}
  <h3 style="margin-top:1rem">Peso ideal</h3><div class="scroll"><table>${pi.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
  <p class="small mut">Peso ajustado (obesidade) = PI + 0,25 × (atual − PI), usando PI pelo IMC 22: <b>${f1(paj)} kg</b></p>
  ${d('pusual')?`<p>Perda de peso: ${f1((d('pusual')-o.peso)/d('pusual')*100)}% do peso usual</p>`:''}</div>`;
 /* composição corporal */
 const siri=D=>(4.95/D-4.5)*100,r=[],A=o.A;
 if(A>=18){
  if(M&&d('dpei')&&d('dabd')&&d('dcox')){const s=d('dpei')+d('dabd')+d('dcox');r.push(['Jackson & Pollock – 3 dobras (peitoral, abdominal, coxa)',siri(1.10938-0.0008267*s+0.0000016*s*s-0.0002574*A)])}
  if(!M&&d('dtri')&&d('dsup')&&d('dcox')){const s=d('dtri')+d('dsup')+d('dcox');r.push(['Jackson & Pollock – 3 dobras (tríceps, suprailíaca, coxa)',siri(1.0994921-0.0009929*s+0.0000023*s*s-0.0001392*A)])}
  if(['dpei','daxi','dtri','dsub','dabd','dsup','dcox'].every(k=>d(k))){const s=['dpei','daxi','dtri','dsub','dabd','dsup','dcox'].reduce((a,k)=>a+d(k),0);r.push(['Jackson & Pollock – 7 dobras',siri(M?1.112-0.00043499*s+0.00000055*s*s-0.00028826*A:1.097-0.00046971*s+0.00000056*s*s-0.00012828*A)])}
 }
 if(d('dtri')&&d('dsub')&&d('dsup')&&d('dabd'))r.push(['Faulkner – 4 dobras',(d('dtri')+d('dsub')+d('dsup')+d('dabd'))*0.153+5.783]);
 if(M&&cin>d('pescoco')&&d('pescoco'))r.push(['Marinha dos EUA (circunferências)',86.010*Math.log10(cin-d('pescoco'))-70.041*Math.log10(o.altura)+36.76]);
 if(!M&&qua&&cin&&d('pescoco')&&cin+qua>d('pescoco'))r.push(['Marinha dos EUA (circunferências)',163.205*Math.log10(cin+qua-d('pescoco'))-97.684*Math.log10(o.altura)-78.387]);
 if(A>=16)r.push(['Deurenberg (IMC, idade e sexo)',1.2*v+0.23*A-10.8*(M?1:0)-5.4]);
 h+=`<div class="card"><h2>Composição corporal (% de gordura)</h2>${r.length?`<div class="scroll"><table><tr><th>Método</th><th>%G</th><th>Gordura</th><th>MLG</th><th></th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${f1(x[1])}%</td><td>${f1(o.peso*x[1]/100)} kg</td><td>${f1(o.peso*(1-x[1]/100))} kg</td><td><button class="btn sm sec" onclick="S.ci.gc='${x[1].toFixed(1)}';render()">usar</button></td></tr>`).join('')}</table></div>`:'<p class="mut small">Preencha dobras ou circunferências para calcular.</p>'}</div>`;
 /* energia */
 const el=energyList(o);if(!S.ci.base||!el.find(x=>x.id===S.ci.base&&x.g))S.ci.base=(el.find(x=>x.g)||{}).id;
 h+=`<div class="card"><h2>Gasto energético – todas as fórmulas</h2>${o.cond!=='none'&&o.sexo==='F'?`<p class="small mut">Adicional de gestação/lactação (DRI) de +${CADD[o.cond]} kcal incluído.</p>`:''}
  <div class="scroll"><table><tr><th>Fórmula</th><th>TMB</th><th>GET</th></tr>${el.map(x=>`<tr><td>${x.n}</td><td>${x.t?f0(x.t):'-'}</td><td>${x.g?'<b>'+f0(x.g)+'</b>':x.need?'<span class="small mut">informe % gordura</span>':'<span class="small mut">fora da faixa de idade</span>'}</td></tr>`).join('')}</table></div>
  <p class="small mut">GET = TMB × fator de atividade (Harris-Benedict; a fórmula FAO usa fatores FAO/OMS por sexo). O EER da DRI é o gasto total estimado e já considera a atividade. Para crianças/adolescentes com sobrepeso, a DRI tem equações próprias que não estão aqui.</p></div>`;
 /* necessidades */
 const sel=el.find(x=>x.id===S.ci.base),kc=sel?sel.g:0;
 if(kc){const R=amdr(A,m),pr=protRDA(A,m,o.cond);
  h+=`<div class="card"><h2>Necessidades (DRI e OMS)</h2><label>Base de energia</label><select onchange="ci('base',this.value)">${el.filter(x=>x.g).map(x=>`<option value="${x.id}" ${x.id===S.ci.base?'selected':''}>${x.n} → ${f0(x.g)} kcal</option>`).join('')}</select>
  <div class="scroll" style="margin-top:.8rem"><table><tr><th>Nutriente</th><th>Recomendação</th><th>Em gramas</th></tr>
  ${R?`<tr><td>Carboidrato (AMDR)</td><td>${R.c[0]}–${R.c[1]}% das kcal</td><td>${f0(kc*R.c[0]/400)}–${f0(kc*R.c[1]/400)} g</td></tr><tr><td>Proteína (AMDR)</td><td>${R.p[0]}–${R.p[1]}% das kcal</td><td>${f0(kc*R.p[0]/400)}–${f0(kc*R.p[1]/400)} g</td></tr><tr><td>Lipídio (AMDR)</td><td>${R.l[0]}–${R.l[1]}% das kcal</td><td>${f0(kc*R.l[0]/900)}–${f0(kc*R.l[1]/900)} g</td></tr>`:''}
  <tr><td>Proteína (RDA)</td><td>${pr} g/kg</td><td>${f0(pr*o.peso)} g</td></tr>
  <tr><td>Carboidrato mínimo (RDA)</td><td>—</td><td>${chorda(A,m,o.cond)} g</td></tr>
  <tr><td>Fibras (AI)</td><td>14 g/1.000 kcal</td><td>${f0(14*kc/1000)} g</td></tr>
  <tr><td>Água total, incluindo alimentos (AI)</td><td>—</td><td>${aguaAI(A,m,o.sexo,o.cond)} L</td></tr>
  <tr><td>Água prática (35 mL/kg)</td><td>—</td><td>${f1(o.peso*0.035)} L</td></tr>
  <tr><td>Açúcar livre (OMS)</td><td>&lt; 10% das kcal</td><td>&lt; ${f0(kc*0.1/4)} g</td></tr>
  <tr><td>Gordura saturada (OMS)</td><td>&lt; 10% das kcal</td><td>&lt; ${f0(kc*0.1/9)} g</td></tr>
  <tr><td>Gordura trans (OMS)</td><td>&lt; 1% das kcal</td><td>&lt; ${f1(kc*0.01/9)} g</td></tr>
  <tr><td>Sódio (OMS)</td><td>&lt; 2 g (5 g de sal)</td><td>—</td></tr></table></div>
  <p class="small mut">Idosos: a ESPEN sugere 1,0–1,2 g/kg de proteína. Atletas: 1,2–2,0 g/kg conforme modalidade. Avalie caso a caso.</p></div>`}
 /* Chumlea */
 if(d('joelho')&&d('braco')&&A>=60){
  const aj=d('joelho'),cb=d('braco'),est=M?64.19-0.04*o.idade+2.02*aj:84.88-0.24*o.idade+1.83*aj,pe=M?aj*1.19+cb*3.21-86.82:aj*1.01+cb*2.81-66.04;
  h+=`<div class="card"><h2>Estimativas (Chumlea) – idosos</h2><p>Altura estimada: <b>${f1(est)} cm</b> · Peso estimado: <b>${f1(pe)} kg</b></p></div>`}
 return h;
}
/* ===== ALIMENTOS ===== */
function vAlimentos(){
 return `<h1>Alimentos</h1><p class="mut small">Valores por 100 g, aproximados (estilo tabela TACO). Confira na tabela oficial antes de usar em caso real. NOVA = classificação do Guia Alimentar do MS.</p>
 <div class="grid g2" style="margin-bottom:1rem"><input placeholder="Buscar alimento..." oninput="S.q=this.value;document.getElementById('flist').innerHTML=fList()">
 <select onchange="S.fgr=this.value;document.getElementById('flist').innerHTML=fList()"><option value="">Todos os grupos</option>${GRUPOS.map(g=>`<option ${S.fgr===g?'selected':''}>${g}</option>`).join('')}</select></div>
 <div class="card scroll" id="flist">${fList()}</div>
 <div class="card"><h2>Adicionar alimento próprio</h2><form onsubmit="addFood(event)"><div class="grid g4 keep"><div style="grid-column:1/-1"><label>Nome</label><input name="nome" required></div>
  <div><label>Grupo</label><select name="gr">${GRUPOS.map(g=>`<option>${g}</option>`).join('')}</select></div><div><label>NOVA</label><select name="nova"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
  <div><label>Kcal</label><input name="k" type="number" step="0.1" required></div><div><label>Prot (g)</label><input name="p" type="number" step="0.1" required></div>
  <div><label>Carb (g)</label><input name="c" type="number" step="0.1" required></div><div><label>Lip (g)</label><input name="l" type="number" step="0.1" required></div><div><label>Fibra (g)</label><input name="f" type="number" step="0.1"></div></div>
  <button class="btn" style="margin-top:.8rem">Adicionar</button></form></div>`;
}
function fList(){
 const q=S.q.toLowerCase(),l=allFoods().filter(f=>f.nome.toLowerCase().includes(q)&&(!S.fgr||f.gr===S.fgr));
 return `<table><tr><th>Alimento</th><th>Kcal</th><th>P</th><th>C</th><th>L</th><th>Fibra</th><th>NOVA</th><th></th></tr>${l.map(f=>`<tr><td>${esc(f.nome)}${f.base?'':' <span class="tag">meu</span>'}<div class="small mut">${esc(f.gr)}</div></td><td>${f1(f.k)}</td><td>${f1(f.p)}</td><td>${f1(f.c)}</td><td>${f1(f.l)}</td><td>${f1(f.f||0)}</td><td>${f.nova||1}</td><td>${f.base?'':`<button class="btn sm red" onclick="delFood('${f.id}')">×</button>`}</td></tr>`).join('')}</table>`;
}
function addFood(e){e.preventDefault();const f=e.target.elements;S.data.foods.push({id:'c'+uid(),nome:f.nome.value.trim(),gr:f.gr.value,nova:+f.nova.value,k:num(f.k.value),p:num(f.p.value),c:num(f.c.value),l:num(f.l.value),f:num(f.f.value)});save();toast('Alimento adicionado');render()}
function delFood(id){if(!confirm('Apagar este alimento?'))return;S.data.foods=S.data.foods.filter(f=>f.id!==id);save();render()}

/* ===== REFERÊNCIAS ===== */
function vRef(){
 const R=[['< 18,5','Baixo peso'],['18,5 a 24,9','Eutrofia'],['25 a 29,9','Sobrepeso'],['30 a 34,9','Obesidade grau I'],['35 a 39,9','Obesidade grau II'],['≥ 40','Obesidade grau III']];
 return `<h1>Referências</h1><p class="mut small">Resumo de consulta para estudo. Confirme sempre nas fontes oficiais e com seu(sua) professor(a).</p>
 <div class="card"><h2>Guia Alimentar para a População Brasileira (MS, 2014)</h2>
  <p><b>Regra de ouro:</b> prefira sempre alimentos in natura ou minimamente processados e preparações culinárias a alimentos ultraprocessados.</p>
  <ol class="small" style="padding-left:1.2rem;margin:.4rem 0">${['Fazer de alimentos in natura ou minimamente processados a base da alimentação','Utilizar óleos, gorduras, sal e açúcar em pequenas quantidades ao temperar e cozinhar alimentos e criar preparações culinárias','Limitar o consumo de alimentos processados','Evitar o consumo de alimentos ultraprocessados','Comer com regularidade e atenção, em ambientes apropriados e, sempre que possível, com companhia','Fazer compras em locais que ofertam variedades de alimentos in natura ou minimamente processados','Desenvolver, exercitar e partilhar habilidades culinárias','Planejar o uso do tempo para dar à alimentação o espaço que ela merece','Dar preferência, quando fora de casa, a locais que servem refeições feitas na hora','Ser crítico quanto a informações, orientações e mensagens sobre alimentação veiculadas em propagandas comerciais'].map(x=>`<li>${x}</li>`).join('')}</ol>
  <h3 style="margin-top:1rem">Classificação NOVA</h3><table>${[[1,'Arroz, feijão, frutas, legumes, carnes, ovos, leite, farinhas, massas simples'],[2,'Óleos, gorduras, sal, açúcar, mel, amidos'],[3,'Queijos, pães simples, conservas, frutas em calda'],[4,'Refrigerantes, biscoitos recheados, salgadinhos, embutidos, pães de forma industriais, macarrão instantâneo']].map(r=>`<tr><td><b>${r[0]}</b> ${NOVAN[r[0]]}</td><td class="small">${r[1]}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Classificações antropométricas</h2><div class="grid g2"><div><h3>IMC – adultos (OMS)</h3><table>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
  <div><h3>IMC – idosos ≥ 60 anos (SISVAN/MS)</h3><table><tr><td>≤ 22</td><td>Baixo peso</td></tr><tr><td>&gt; 22 e &lt; 27</td><td>Adequado</td></tr><tr><td>≥ 27</td><td>Sobrepeso</td></tr></table>
  <h3 style="margin-top:1rem">Cintura (OMS)</h3><p class="small">Risco aumentado: homens ≥ 94 cm, mulheres ≥ 80 cm. Muito aumentado: ≥ 102 cm e ≥ 88 cm.</p></div></div>
  <p class="small mut">Crianças e adolescentes: usar escore-z de IMC/idade (curvas da OMS), conforme SISVAN e Caderneta da Criança.</p></div>
 <div class="card"><h2>DRI – faixas de distribuição de macronutrientes (AMDR)</h2><table><tr><th>Faixa etária</th><th>CHO</th><th>PTN</th><th>LIP</th></tr><tr><td>1 a 3 anos</td><td>45–65%</td><td>5–20%</td><td>30–40%</td></tr><tr><td>4 a 18 anos</td><td>45–65%</td><td>10–30%</td><td>25–35%</td></tr><tr><td>Adultos</td><td>45–65%</td><td>10–35%</td><td>20–35%</td></tr></table>
  <p class="small mut">Outras referências: fibras 14 g/1.000 kcal; açúcar livre e gordura saturada &lt; 10% das kcal; gordura trans &lt; 1%; sódio &lt; 2 g/dia (OMS).</p></div>
 <div class="card"><h2>DRI – micronutrientes (RDA/AI)</h2><div class="grid g3">
  <div><label>Sexo</label><select onchange="S.rf.sexo=this.value;rfOut()"><option value="F">Feminino</option><option value="M">Masculino</option></select></div>
  <div><label>Idade (anos)</label><input type="number" value="${S.rf.idade}" oninput="S.rf.idade=num(this.value);rfOut()"></div>
  <div><label>Condição</label><select onchange="S.rf.cond=this.value;rfOut()">${CONDL.filter(c=>c[0]==='none'||c[0][0]==='g'||c[0][0]==='l').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div></div>
  <div id="rfout" style="margin-top:.8rem">${rfHtml()}</div></div>
 <div class="card"><h2>Fontes</h2><ul class="small" style="padding-left:1.2rem;margin:0"><li>Institute of Medicine. Dietary Reference Intakes for Energy, Carbohydrate, Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids (2005) e demais volumes DRI.</li><li>National Academies. Dietary Reference Intakes for Sodium and Potassium (2019).</li><li>Ministério da Saúde. Guia Alimentar para a População Brasileira, 2ª ed. (2014).</li><li>Ministério da Saúde. Orientações para a avaliação do estado nutricional no SISVAN.</li><li>FAO/WHO/UNU. Energy and protein requirements (1985). OMS. Physical status (1995) e Obesity (2000).</li><li>NEPA/Unicamp. Tabela Brasileira de Composição de Alimentos (TACO), 4ª ed. (2011).</li></ul></div>`;
}
function rfHtml(){
 const A=Math.floor(S.rf.idade),rows=driMicro(S.rf.sexo,A,S.rf.cond);
 if(!rows.length)return '<p class="mut small">Para menores de 1 ano, consulte a tabela DRI de lactentes.</p>';
 return `<p class="small mut">Grupo: ${GR[grp(A)]}${S.rf.cond!=='none'&&S.rf.sexo==='F'&&(A<14||A>50)?' · valores de gestação/lactação só existem para 14–50 anos (mostrando os valores gerais)':''}</p><table>${rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td class="small mut">${r[2]}</td></tr>`).join('')}</table>`;
}
function rfOut(){const e=document.getElementById('rfout');if(e)e.innerHTML=rfHtml()}

/* ===== CONTA ===== */
function vConta(){
 const u=S.user;
 return `<h1>Minha conta</h1>
 <form class="card" onsubmit="saveProfile(event)"><h2>Perfil</h2><div class="grid g2"><div><label>Nome</label><input name="nome" required value="${esc(u.nome)}"></div><div><label>E-mail</label><input value="${esc(u.email)}" disabled></div>
 ${u.perfil==='est'?`<div><label>Instituição</label><input name="inst" value="${esc(u.inst)}"></div><div><label>Período</label><input name="periodo" value="${esc(u.periodo)}"></div><div><label>Orientador(a)</label><input name="orient" value="${esc(u.orient)}"></div>`:''}
 ${u.perfil==='nut'?`<div><label>CRN</label><input name="crn" value="${esc(u.crn)}"></div>`:''}</div><button class="btn" style="margin-top:.8rem">Salvar perfil</button></form>
 <form class="card" onsubmit="changePass(event)"><h2>Trocar senha</h2>${pwField('atual','Senha atual','current-password')}${pwField('nova','Nova senha (mín. 8, com letras e números)','new-password',1)}${pwField('nova2','Confirmar nova senha','new-password')}<div class="err" id="authmsg"></div><button class="btn">Trocar senha</button></form>
 <div class="card"><h2>Backup dos dados</h2><p class="small mut">Os dados ficam só neste navegador. Faça backup com frequência e guarde o arquivo em local seguro (ele contém dados de pacientes).</p>
 <div class="row"><button class="btn sec" onclick="exportData()">Baixar backup</button><label class="btn ghost" style="margin:0">Restaurar backup<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>
 <div class="card"><h2>Sessão</h2><div class="row"><button class="btn ghost" onclick="logout()">Sair</button><button class="btn red" onclick="delAccount()">Excluir minha conta e dados</button></div></div>`;
}
function saveProfile(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 ['nome','inst','periodo','orient','crn'].forEach(k=>{if(f[k])u[k]=f[k].value.trim()});LS.set('nd_users',users);S.user=u;toast('Perfil salvo');render();
}
async function changePass(e){
 e.preventDefault();const f=e.target.elements,users=LS.get('nd_users',[]),u=users.find(x=>x.id===S.user.id);
 if(u.hash!==await hash(f.atual.value,u.salt))return amsg('Senha atual incorreta.');
 if(!pwOk(f.nova.value))return amsg('A nova senha precisa de 8+ caracteres, com letras e números.');
 if(f.nova.value!==f.nova2.value)return amsg('As senhas não conferem.');
 u.hash=await hash(f.nova.value,u.salt);LS.set('nd_users',users);S.user=u;toast('Senha alterada.');e.target.reset();
}
function exportData(){
 const b=new Blob([JSON.stringify({v:2,data:S.data},null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='backup-'+today()+'.json';a.click();
}
function importData(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data||!Array.isArray(j.data.patients))throw 0;if(!confirm('Isso substitui os dados atuais. Continuar?'))return;S.data=Object.assign(emptyData(),j.data);save();toast('Backup restaurado');render()}catch(e){toast('Arquivo inválido.')}};
 r.readAsText(f);
}
function delAccount(){
 if(!confirm('Excluir sua conta e TODOS os dados? Não dá para desfazer.'))return;
 LS.set('nd_users',LS.get('nd_users',[]).filter(u=>u.id!==S.user.id));localStorage.removeItem('nd_data_'+S.user.id);logout();
}
boot();
</script>
