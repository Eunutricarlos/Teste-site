/* ---- 3.3 COMPARADOR DE CONSULTAS, METAS, LINHA DO TEMPO E RELATÓRIO ----
   Avaliação: a.orig = 'medido' | 'informado' (peso/medidas informados pelo paciente), a.gcm = método do % de gordura. */
const ORIGEM={medido:'Medido pelo profissional',informado:'Informado pelo paciente'};
const idadeEm=(p,d)=>Math.floor((new Date(d+'T12:00:00')-new Date(p.nasc+'T12:00:00'))/31557600000);
const avAsc=p=>[...(p.aval||[])].sort((a,b)=>a.data.localeCompare(b.data));
const mg=a=>a.gc?a.peso*a.gc/100:0,mm=a=>a.gc?a.peso*(1-a.gc/100):0;
/* linhas do comparador: k, nome, unidade, categoria de origem, função de valor */
const CMPROWS=[
 ['peso','Peso','kg','med',a=>a.peso],['altura','Altura','cm','med',a=>a.altura],
 ['imc','IMC','kg/m²','calc',a=>imc(a.peso,a.altura)],
 ['gc','% de gordura','%','inf',a=>a.gc],['mg','Massa gorda','kg','calc',mg],['mm','Massa magra','kg','calc',mm],
 ['cintura','Cintura','cm','med',a=>a.cintura],['quadril','Quadril','cm','med',a=>a.quadril],['rcq','Relação cintura/quadril','','calc',a=>a.cintura&&a.quadril?a.cintura/a.quadril:0],
 ['pescoco','Pescoço','cm','med',a=>a.pescoco],['braco','Braço (CB)','cm','med',a=>a.braco],['joelho','Altura do joelho','cm','med',a=>a.joelho],
 ['dtri','Dobra tricipital','mm','med',a=>a.dtri],['dsub','Dobra subescapular','mm','med',a=>a.dsub],['dsup','Dobra suprailíaca','mm','med',a=>a.dsup],['dabd','Dobra abdominal','mm','med',a=>a.dabd],['dpei','Dobra peitoral','mm','med',a=>a.dpei],['daxi','Dobra axilar média','mm','med',a=>a.daxi],['dcox','Dobra da coxa','mm','med',a=>a.dcox]
];
function origRow(r,A,B){
 if(r[3]==='calc')return 'Calculado';
 if(r[3]==='inf')return 'Informado'+((A.gcm||B.gcm)?' ('+esc(A.gcm||B.gcm)+')':'');
 const o=a=>a.orig==='informado'?'Informado pelo paciente':'Medido';
 return o(A)===o(B)?o(A):'Medido / informado (origens diferentes)';
}
function cmpDados(p,A,B){
 return CMPROWS.map(r=>{const va=r[4](A),vb=r[4](B),ok=va>0&&vb>0;
  return{k:r[0],n:r[1],u:r[2],va:va>0?va:null,vb:vb>0?vb:null,d:ok?vb-va:null,pc:ok?(vb-va)/va*100:null,orig:origRow(r,A,B)};
 }).filter(x=>x.va!==null||x.vb!==null);
}
/* metas: p.metas=[{id,tipo,alvo,prazo,txt,st,criada}] */
const MTIPO={peso:['Peso (kg)',a=>a.peso],gc:['% de gordura',a=>a.gc],cintura:['Cintura (cm)',a=>a.cintura],imc:['IMC (kg/m²)',a=>imc(a.peso,a.altura)],txt:['Outra (texto livre)',null]};
function metaProg(m,A,B){
 const f=MTIPO[m.tipo]&&MTIPO[m.tipo][1];if(!f)return null;
 const va=f(A),vb=f(B),al=num(m.alvo);if(!(va>0)||!(vb>0)||!(al>0))return null;
 const falta=al-vb,tot=al-va;
 return{va,vb,al,falta,pc:tot?(vb-va)/tot*100:null,sentido:tot&&(vb-va)*tot<0?'oposto':'ok'};
}
function cmetaAdd(pid){
 const f=id=>document.getElementById(id),p=pat(pid),t=f('mt').value,al=num(f('ma').value),tx=(f('mx').value||'').trim();
 if(t!=='txt'&&!(al>0))return toast('Informe o valor da meta.');if(t==='txt'&&!tx)return toast('Descreva a meta.');
 p.metas=p.metas||[];p.metas.push({id:uid(),tipo:t,alvo:al||'',prazo:f('mp').value,txt:tx,st:'aberta',ok:false,criada:today()});save();render();
}
function cmetaDel(pid,id){if(!confirm('Remover esta meta?'))return;const p=pat(pid);p.metas=p.metas.filter(m=>m.id!==id);save();render()}
function cmetaSt(pid,id,v){const m=pat(pid).metas.find(x=>x.id===id);if(m){m.st=v;m.ok=v==='cumprida';save();render()}}
/* metas antigas (só texto, com caixa de marcar) continuam valendo: tipo 'txt' e situação vinda de m.ok */
const metasDe=p=>(p.metas||[]).map(m=>Object.assign({},m,{tipo:m.tipo||'txt',st:m.ok?'cumprida':(m.st==='abandonada'?'abandonada':'aberta'),criada:m.criada||''}));
S.cmp=S.cmp||{a:'',b:'',inc:{med:1,graf:1,metas:1,obs:1,rel:1}};
const dFmt=(v,u)=>v===null||v===undefined?'—':(Math.abs(v)>=100?f0(v):f1(v))+(u?' '+u:'');
function cmpChart(pts,u,color,da,db){
 if(pts.length<2)return '<p class="small mut">Menos de 2 registros.</p>';
 const W=320,H=140,pl=36,pr=14,pt=16,pb=24,xs=pts.map(p=>new Date(p.d).getTime()),ys=pts.map(p=>p.v),x0=Math.min(...xs),x1=Math.max(...xs);
 let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}const pd=(y1-y0)*.18;y0-=pd;y1+=pd;
 const X=t=>pl+(x1===x0?.5:(t-x0)/(x1-x0))*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb),dm=d=>{const a=d.split('-');return a[2]+'/'+a[1]};
 const line=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' '),mark=(d,t)=>{const x=X(new Date(d).getTime());return `<line x1="${x}" y1="${pt}" x2="${x}" y2="${H-pb}" stroke="#d75413" stroke-dasharray="3 3"/><text x="${x}" y="${pt-4}" font-size="9" text-anchor="middle" fill="#d75413">${t}</text>`};
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Evolução de ${u}"><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#dcdfe2"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="#dcdfe2"/>
 <text x="${pl-4}" y="${Y(y1-pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y1-pd)}</text><text x="${pl-4}" y="${Y(y0+pd)+4}" font-size="9" text-anchor="end" fill="#66727c">${f1(y0+pd)}</text>
 <text x="${pl}" y="${H-8}" font-size="9" fill="#66727c">${dm(pts[0].d)}</text><text x="${W-pr}" y="${H-8}" font-size="9" text-anchor="end" fill="#66727c">${dm(pts[pts.length-1].d)}</text>
 ${mark(da,'A')}${db!==da?mark(db,'B'):''}<path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}</svg>`;
}
function cmpSel(k,v){S.cmp[k]=v;render()}
function cmpInc(k){S.cmp.inc[k]=S.cmp.inc[k]?0:1;render()}
function cmpObs(p,A,B){
 const lo=A.data,hi=B.data,cons=(p.consultas||[]).filter(c=>c.data>=lo&&c.data<=hi).sort((a,b)=>a.data.localeCompare(b.data));
 const dif=(p.diario||[]).filter(r=>r.data>=lo&&r.data<=hi&&(r.dif||'').trim()).sort((a,b)=>a.data.localeCompare(b.data));
 const qa=d=>[...(p.quests||[])].filter(q=>q.data<=d).sort((a,b)=>b.data.localeCompare(a.data))[0];
 return{cons,dif,qA:qa(A.data),qB:qa(B.data)};
}
function cmpMetasHtml(p,A,B){
 const ms=metasDe(p);if(!ms.length)return '<p class="small mut">Nenhuma meta cadastrada.</p>';
 return `<div style="overflow:auto"><table><tr><th>Meta</th><th>Prazo</th><th>A</th><th>B</th><th>Alvo</th><th>Situação (fato, não avaliação clínica)</th></tr>${ms.map(m=>{const pr=metaProg(m,A,B),nm=(MTIPO[m.tipo]||[m.tipo])[0];
  return `<tr><td>${esc(m.tipo==='txt'?m.txt:nm)}</td><td>${m.prazo?fdate(m.prazo):'—'}</td>${pr?`<td>${f1(pr.va)}</td><td>${f1(pr.vb)}</td><td>${f1(pr.al)}</td><td class="small">${pr.falta===0?'valor registrado igual ao alvo':`faltam ${f1(Math.abs(pr.falta))} para o alvo`}${pr.pc!==null?` · ${pr.sentido==='oposto'?'variação em sentido oposto ao da meta':f0(Math.abs(pr.pc))+'% do caminho entre A e o alvo'}`:''}</td>`:`<td colspan="3" class="mut small">${m.tipo==='txt'?'meta descritiva':'sem valor registrado nas duas datas'}</td><td class="small">${esc({aberta:'em aberto',cumprida:'marcada como cumprida',abandonada:'abandonada'}[m.st]||'')}</td>`}</tr>`}).join('')}</table></div>`;
}
function cmpRelHtml(p,A,B,dd,o){
 const inc=S.cmp.inc;
 return `<h1>Comparação de avaliações — ${esc(p.nome)}</h1><p>A: <b>${fdate(A.data)}</b> (${ORIGEM[A.orig||'medido']}) · B: <b>${fdate(B.data)}</b> (${ORIGEM[B.orig||'medido']}) · intervalo de ${Math.round((new Date(B.data)-new Date(A.data))/864e5)} dias</p>
 ${inc.med?`<table><tr><th>Dado</th><th>A</th><th>B</th><th>Diferença</th><th>%</th><th>Origem</th></tr>${dd.map(x=>`<tr><td>${x.n}</td><td>${dFmt(x.va,x.u)}</td><td>${dFmt(x.vb,x.u)}</td><td>${x.d===null?'—':(x.d>0?'+':'')+dFmt(x.d,x.u)}</td><td>${x.pc===null?'—':(x.pc>0?'+':'')+f1(x.pc)+'%'}</td><td class="small">${x.orig}</td></tr>`).join('')}</table>`:''}
 ${inc.graf?['peso','imc','gc','cintura'].map(k=>{const r=CMPROWS.find(x=>x[0]===k),pts=avAsc(p).map(a=>({d:a.data,v:r[4](a)})).filter(x=>x.v>0);return pts.length>1?`<h3>${r[1]} (${r[2]})</h3>${cmpChart(pts,r[2],'#1b4f72',A.data,B.data)}`:''}).join(''):''}
 ${inc.metas&&metasDe(p).length?`<h3>Metas</h3>${cmpMetasHtml(p,A,B)}`:''}
 ${inc.obs?`<h3>Observações</h3>${A.obs?`<p><b>Avaliação A (profissional):</b> ${br(A.obs)}</p>`:''}${B.obs?`<p><b>Avaliação B (profissional):</b> ${br(B.obs)}</p>`:''}${o.cons.map(c=>`<p><b>${fdate(c.data)} · ${esc(c.tipo)} (profissional):</b> ${br(c.notas||'')}${c.conduta?'<br><i>Conduta:</i> '+br(c.conduta):''}</p>`).join('')}${o.dif.map(r=>`<p><b>${fdate(r.data)} · diário (relatado pelo paciente):</b> ${br(r.dif)}</p>`).join('')}`:''}
 <p class="small">Legenda: <b>Medido</b> = tomado pelo profissional; <b>Informado</b> = dado trazido pelo paciente; <b>Calculado</b> = obtido por fórmula a partir de dados medidos. Diferenças isoladas não são interpretadas como melhora ou piora clínica; a análise cabe ao profissional. Documento acadêmico, sujeito à supervisão do(a) professor(a) responsável.</p>`;
}
function tComp(p){
 const av=avAsc(p);
 const metaForm=`<div class="card noprint"><h3>Metas</h3><div class="row" style="flex-wrap:wrap;gap:.5rem"><select id="mt" style="width:auto">${Object.keys(MTIPO).map(k=>`<option value="${k}">${MTIPO[k][0]}</option>`).join('')}</select><input id="ma" inputmode="decimal" placeholder="valor-alvo" style="width:100px"><input id="mx" placeholder="descrição (meta de texto)" style="flex:1;min-width:140px"><input id="mp" type="date" style="width:auto"><button class="btn sm" onclick="cmetaAdd('${p.id}')">Adicionar meta</button></div>
 ${metasDe(p).map(m=>`<div class="item"><span style="flex:1">${esc(m.tipo==='txt'?m.txt:(MTIPO[m.tipo]||[m.tipo])[0]+' → '+f1(num(m.alvo)))}${m.prazo?' <span class="small mut">até '+fdate(m.prazo)+'</span>':''} ${m.criada?`<span class="small mut">· criada em ${fdate(m.criada)}</span>`:''}</span><select style="width:auto" onchange="cmetaSt('${p.id}','${m.id}',this.value)">${[['aberta','em aberto'],['cumprida','cumprida'],['abandonada','abandonada']].map(([v,n])=>`<option value="${v}" ${m.st===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn sm red" onclick="cmetaDel('${p.id}','${m.id}')">×</button></div>`).join('')}</div>`;
 if(av.length<2)return `<div class="card"><h2>Comparar avaliações</h2><p class="mut">Registre pelo menos duas avaliações na aba Avaliações para comparar.</p></div>${metaForm}`;
 let a=av.find(x=>x.id===S.cmp.a),b=av.find(x=>x.id===S.cmp.b);
 if(!a)a=av[0];if(!b)b=av[av.length-1];
 let A=a,B=b;if(A.data>B.data){const t=A;A=B;B=t}
 const dd=cmpDados(p,A,B),o=cmpObs(p,A,B),inc=S.cmp.inc,opt=sel=>av.map(x=>`<option value="${x.id}" ${x.id===sel.id?'selected':''}>${fdate(x.data)} · ${f1(x.peso)} kg${x.orig==='informado'?' (informado)':''}</option>`).join('');
 const graf=['peso','imc','gc','cintura','rcq','mm'].map(k=>{const r=CMPROWS.find(x=>x[0]===k),pts=av.map(q=>({d:q.data,v:r[4](q)})).filter(x=>x.v>0);return pts.length>1?`<div class="card"><h3>${r[1]} ${r[2]?'('+r[2]+')':''} <span class="small mut">${r[3]==='calc'?'calculado':r[3]==='inf'?'informado':'medido'}</span></h3>${cmpChart(pts,r[2],'#1b4f72',A.data,B.data)}</div>`:''}).join('');
 return `<div class="screenonly"><div class="card noprint"><h2>Comparar avaliações</h2><div class="grid g2"><div><label>Avaliação A</label><select onchange="cmpSel('a',this.value)">${opt(a)}</select></div><div><label>Avaliação B</label><select onchange="cmpSel('b',this.value)">${opt(b)}</select></div></div>
 <p class="small mut" style="margin-top:.5rem">A diferença é B − A (a mais antiga é sempre A). Os números mostram o que mudou; <b>não indicam melhora ou piora</b>: isso depende do objetivo e do contexto clínico.</p></div>
 <div class="card"><h3>Dados · A ${fdate(A.data)} (${ORIGEM[A.orig||'medido']}) → B ${fdate(B.data)} (${ORIGEM[B.orig||'medido']})</h3><div style="overflow:auto"><table><tr><th>Dado</th><th>A</th><th>B</th><th>Diferença</th><th>%</th><th>Origem</th></tr>
 ${dd.map(x=>`<tr><td>${x.n}</td><td>${dFmt(x.va,x.u)}</td><td>${dFmt(x.vb,x.u)}</td><td><b>${x.d===null?'—':(x.d>0?'+':'')+dFmt(x.d,x.u)}</b></td><td>${x.pc===null?'—':(x.pc>0?'+':'')+f1(x.pc)+'%'}</td><td class="small mut">${x.orig}</td></tr>`).join('')}</table></div>
 <p class="small mut">IMC: A ${imcCls(imc(A.peso,A.altura),idadeEm(p,A.data))} · B ${imcCls(imc(B.peso,B.altura),idadeEm(p,B.data))} (classificação de referência na data de cada avaliação, sem interpretação clínica). Calculado = fórmula sobre dados medidos; informado = trazido pelo paciente.</p></div>
 <div class="grid g2">${graf}</div>
 <div class="card"><h3>Metas e resultados registrados</h3>${cmpMetasHtml(p,A,B)}</div>${metaForm}
 <div class="card"><h3>Observações e dificuldades no período</h3>
  ${A.obs||B.obs?`<p class="small"><b>Observação do avaliador:</b> ${A.obs?fdate(A.data)+': '+br(A.obs):''}${B.obs?' '+fdate(B.data)+': '+br(B.obs):''}</p>`:''}
  ${o.cons.length?o.cons.map(c=>`<div class="small" style="margin:.4rem 0"><b>${fdate(c.data)} · ${esc(c.tipo)}</b> <span class="tag">profissional</span><br>${br(c.notas||'')}${c.conduta?'<br><span class="mut">Conduta:</span> '+br(c.conduta):''}</div>`).join(''):'<p class="small mut">Nenhuma consulta registrada entre A e B.</p>'}
  ${o.dif.length?o.dif.map(r=>`<div class="small" style="margin:.4rem 0"><b>${fdate(r.data)} · ${esc(r.ref||'')}</b> <span class="tag">relatado pelo paciente</span><br>${br(r.dif)}</div>`).join(''):'<p class="small mut">Nenhuma dificuldade registrada no diário neste período.</p>'}
  ${o.qA||o.qB?`<p class="small mut">Questionários: ${o.qA?'antes de A, '+fdate(o.qA.data):''}${o.qA&&o.qB&&o.qA.id!==o.qB.id?' · ':''}${o.qB&&(!o.qA||o.qA.id!==o.qB.id)?'antes de B, '+fdate(o.qB.data):''} (ver na aba Questionário).</p>`:''}</div>
 <div class="card noprint"><h3>Relatório</h3><div class="chips2">${[['med','Dados'],['graf','Gráficos'],['metas','Metas'],['obs','Observações']].map(([k,n])=>`<span class="chip2 ${inc[k]?'on':''}" onclick="cmpInc('${k}')">${n}</span>`).join('')}</div><button class="btn" style="margin-top:.6rem" onclick="window.print()">Imprimir / salvar PDF</button></div></div>
 <div class="printonly pr">${cmpRelHtml(p,A,B,dd,o)}</div>`;
}

const LT=[['aval','Avaliação','Medido'],['cons','Consulta','Profissional'],['plano','Plano','Prescrito'],['diario','Diário','Relatado'],['quest','Questionário','Relatado'],['exame','Exame','Informado'],['meta','Meta','Profissional']];
function linhaEventos(p){

 S.data.plans.filter(x=>x.patientId===p.id).forEach(x=>ev.push({d:x.data,t:'plano',x:`${x.rec?'Recordatório':x.sem?'Plano semanal':'Plano'}: ${x.titulo} · ${f0(planCalc(x).tot.k)} kcal`,tab:x.rec?'rec':'planos',id:x.id}));
 const dias={};(p.diario||[]).forEach(r=>(dias[r.data]=dias[r.data]||[]).push(r));
 Object.keys(dias).forEach(d=>{const l=dias[d],s=l.filter(r=>r.seg==='plano').length;ev.push({d,t:'diario',x:`${l.length} refeição(ões) registrada(s), ${s} seguiram o plano`,tab:'diario',id:'d'+d})});
 (p.quests||[]).forEach(q=>ev.push({d:q.data,t:'quest',x:`Questionário pré-consulta · ${qCount(p,q.resp).n} respostas`,tab:'quest',id:q.id}));
 (p.exames||[]).forEach(e=>ev.push({d:e.data,t:'exame',x:`${e.nome}: ${e.valor} ${e.un||''}`,tab:'exames',id:e.id}));
 metasDe(p).filter(m=>m.criada).forEach(m=>ev.push({d:m.criada,t:'meta',x:'Meta definida: '+(m.tipo==='txt'?m.txt:(MTIPO[m.tipo]||[m.tipo])[0]+' → '+f1(num(m.alvo))),tab:'comp',id:m.id}));
 return ev.sort((a,b)=>b.d.localeCompare(a.d)||a.t.localeCompare(b.t));
}
S.lf=S.lf||[];
function ltFiltro(t){const i=S.lf.indexOf(t);if(i>=0)S.lf.splice(i,1);else S.lf.push(t);render()}
function tLinha(p){
 const ev=linhaEventos(p).filter(e=>!S.lf.length||S.lf.includes(e.t));let mes='';
 return `<div class="card"><h2>Histórico do paciente</h2><p class="small mut">Tudo em ordem cronológica, da data mais recente para a mais antiga. A etiqueta mostra a origem: medido, relatado, prescrito ou informado.</p>
 <div class="chips2 noprint">${LT.map(x=>`<span class="chip2 ${S.lf.includes(x[0])?'on':''}" onclick="ltFiltro('${x[0]}')">${x[1]}</span>`).join('')}</div>
 ${ev.length?ev.map(e=>{const m=e.d.slice(0,7),h=m!==mes?`<h3 style="margin-top:1rem">${new Date(e.d+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3>`:'';mes=m;const L=LT.find(x=>x[0]===e.t);return h+`<div class="item pill" onclick="setTab('${e.tab}')"><div style="min-width:70px" class="small mut">${fdate(e.d).slice(0,5)}</div><div style="flex:1"><b>${L[1]}</b> <span class="tag">${L[2]}</span><div class="small">${esc(e.x)}</div></div></div>`}).join(''):'<p class="mut" style="margin-top:.6rem">Nada registrado ainda.</p>'}</div>`;
}

function tResumo(p){
 const ad=drAdesao(p,7),ul=qUltima(p),c=qCount(p),ms=metasDe(p).filter(m=>m.st==='aberta');
 const extra=`<div class="grid g3 noprint" style="margin-bottom:1rem">

  <div class="card pill" onclick="setTab('quest')"><h3>Questionário</h3>${ul?`<p>Último em <b>${fdate(ul.data)}</b></p>`:'<p class="small mut">Ainda não registrado.</p>'}${c.n?`<p class="small mut">Rascunho: ${c.n} de ${c.t} respondidas</p>`:''}</div>
  <div class="card pill" onclick="setTab('comp')"><h3>Metas</h3><p><b>${ms.length}</b> em aberto</p><p class="small mut">${(p.aval||[]).length} avaliações para comparar</p></div></div>`;
 return extra+tResumo0(p);
}
